name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Build private-path card
        env:
          CARD_PATH: ${{ secrets.CARD_PATH }}
          CARD_NAME: ${{ secrets.CARD_NAME }}
          CARD_PHONE: ${{ secrets.CARD_PHONE }}
          CARD_EMAIL: ${{ secrets.CARD_EMAIL }}
          CARD_IG_URL: ${{ secrets.CARD_IG_URL }}
          CARD_LINE_URL: ${{ secrets.CARD_LINE_URL }}
          CARD_DISCORD_URL: ${{ secrets.CARD_DISCORD_URL }}
        run: python scripts/build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
