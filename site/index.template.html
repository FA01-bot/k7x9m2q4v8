<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#151a2d">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>__CARD_NAME__｜個人名片</title>
<script>
    (() => {
      const uaData = navigator.userAgentData;
      const ua = navigator.userAgent || "";
      const iPadDesktopUA =
        navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;

      const mobile =
        (uaData && typeof uaData.mobile === "boolean")
          ? uaData.mobile
          : (
              /Android|iPhone|iPod|IEMobile|Opera Mini|Mobile/i.test(ua) ||
              iPadDesktopUA ||
              /iPad/i.test(ua)
            );

      document.documentElement.classList.add(
        mobile ? "device-mobile" : "device-desktop"
      );
    })();
  </script>



  <style>
    :root{
      color-scheme: dark;
      --page:#121728;
      --panel:#282e3f;
      --text:#fff7f6;
      --pink:#ffb3c1;

      /*
        名片永遠跟著目前可視範圍調整，但不貼滿瀏覽器邊界。
        一般手機約 18px，較大的螢幕會自然增加到最多 34px。
      */
      --outer-gap:clamp(18px,3.2vmin,34px);

      /*
        橫向右側工具列左右留白統一用同一個值，
        避免左邊到圖片與右邊到名片邊界看起來不一致。
      */
      --toolbar-gap-x:clamp(12px,1.15vw,16px);

      /* JS 會用 visualViewport 的真正可視範圍更新這兩個值 */
      --vwpx:100vw;
      --vhpx:100vh;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--page);
    }

    html{
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }

    body{
      color:var(--text);

      /*
        網頁能要求「系統 UI 字體」，但 Chrome/Safari 不一定會把
        手機主題商店或 OEM 自訂字體暴露給網頁。
      */
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        radial-gradient(circle at 20% 12%, rgba(111,76,255,.14), transparent 30%),
        radial-gradient(circle at 80% 88%, rgba(255,135,169,.08), transparent 26%),
        var(--page);
      background-size:46px 46px,46px 46px,auto,auto,auto;
    }

    .viewport{
      width:var(--vwpx);
      height:var(--vhpx);
      display:grid;
      place-items:center;
      overflow:hidden;

      /*
        safe-area 與我們自己的外距取較大值。
        所以有瀏海 / 圓角螢幕時也不會貼邊。
      */
      padding:
        max(var(--outer-gap), env(safe-area-inset-top))
        max(var(--outer-gap), env(safe-area-inset-right))
        max(var(--outer-gap), env(safe-area-inset-bottom))
        max(var(--outer-gap), env(safe-area-inset-left));
    }

    .card{
      /*
        直向仍維持最多 460 × 900，
        但寬高改成吃「viewport 扣掉外距後」的可用空間。
      */
      width:min(100%,460px);
      height:min(100%,900px);
      min-height:0;

      display:flex;
      flex-direction:column;
      overflow:hidden;

      border-radius:clamp(18px,3vw,30px);
      border:1px solid rgba(255,255,255,.14);
      background:#202638;
      box-shadow:0 20px 60px rgba(0,0,0,.34);
    }

    .hero{
      position:relative;
      flex:1 1 0;
      min-height:0;
      overflow:hidden;
      background:#303648;
    }

    .hero img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center 48%;
      transform:scale(1.01);
      filter:saturate(.88) brightness(.91) contrast(.96);
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(
          180deg,
          rgba(20,24,38,.01) 0%,
          rgba(20,24,38,.035) 35%,
          rgba(20,24,38,.12) 66%,
          rgba(28,32,45,.46) 100%
        ),
        linear-gradient(90deg,rgba(20,24,38,.10),transparent 58%);
      pointer-events:none;
    }

    .intro{
      position:absolute;
      z-index:2;
      left:clamp(16px,5.8vw,32px);
      right:clamp(16px,5vw,26px);
      bottom:clamp(12px,2.6vh,28px);
      text-shadow:0 2px 14px rgba(0,0,0,.62), 0 0 2px rgba(0,0,0,.22);
    }

    .name{
      margin:0 0 clamp(5px,1.15vh,11px);
      font-family:inherit;
      font-size:clamp(1.55rem,4.2vh,2.55rem);
      line-height:1.05;
      font-weight:800;
      letter-spacing:.01em;
    }

    .bio{
      margin:0;
      max-width:365px;
      font-family:inherit;
      font-size:clamp(.69rem,1.65vh,.98rem);
      line-height:1.52;
      font-weight:500;
      letter-spacing:.005em;
      color:#fff8f7;
    }

    .contact-panel{
      flex:0 0 auto;
      padding:
        clamp(8px,1.55vh,18px)
        clamp(14px,4.8vw,26px)
        clamp(9px,1.7vh,20px);

      background:
        linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)),
        var(--panel);
    }

    .quick-actions{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      align-items:stretch;
      column-gap:clamp(7px,2vw,10px);
      row-gap:clamp(8px,1.35vh,14px);
      margin:0 auto;
    }

    .quick{
      appearance:none;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.035);
      color:var(--pink);
      text-decoration:none;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:clamp(3px,.55vh,5px);

      min-width:0;
      min-height:clamp(48px,6.2vh,60px);
      padding:clamp(6px,.9vh,9px) 4px;

      border-radius:clamp(13px,2.6vw,18px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
      -webkit-tap-highlight-color:transparent;
      transition:transform .14s ease, background .14s ease, border-color .14s ease;
    }

    .quick:active{
      transform:scale(.96);
      background:rgba(255,255,255,.07);
      border-color:rgba(255,255,255,.13);
    }

    .quick svg{
      width:clamp(23px,3.2vh,29px);
      height:clamp(23px,3.2vh,29px);
      display:block;
      flex:0 0 auto;
      fill:currentColor;
    }


    .brand-logo{
      display:block;
      flex:0 0 auto;
      color:var(--pink);
      overflow:visible;
    }

    /*
      品牌圖示統一用同一個視覺框。
      Gmail 略縮、LINE 略放大，讓肉眼大小跟 Discord / Phone 接近。
    */
    .quick svg.brand-gmail{
      width:clamp(24px,4.35vh,29px);
      height:clamp(24px,4.35vh,29px);
      fill:initial;
    }

    .quick svg.brand-line{
      width:clamp(29px,5.0vh,34px);
      height:clamp(29px,5.0vh,34px);
      fill:initial;
    }

    .quick svg.brand-gmail{
      transform:scale(.90);
      transform-origin:center;
    }

    .quick svg.brand-line{
      transform:none;
    }

    .quick-label{
      display:block;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      color:rgba(255,255,255,.72);
      font-family:inherit;
      font-size:clamp(.55rem,1.05vh,.66rem);
      line-height:1;
      font-weight:600;
      letter-spacing:.01em;
    }

    .line-bubble{
      width:clamp(24px,3.25vh,29px);
      height:clamp(20px,2.65vh,24px);
      border-radius:45% 45% 45% 40%;
      display:grid;
      place-items:center;
      position:relative;
      flex:0 0 auto;
      background:var(--pink);
      color:#2c3142;
      font-family:inherit;
      font-size:clamp(.38rem,.82vh,.49rem);
      line-height:1;
      letter-spacing:-.04em;
      font-weight:900;
    }

    .line-bubble::after{
      content:"";
      position:absolute;
      right:3px;
      bottom:-4px;
      border-width:4px 1px 0 5px;
      border-style:solid;
      border-color:var(--pink) transparent transparent transparent;
      transform:rotate(-9deg);
    }

    .divider{
      height:0;
      margin:0;
    }

    .instagram{
      grid-column:1 / -1;
      min-height:clamp(39px,5.25vh,51px);
      border-radius:clamp(14px,3vw,20px);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      color:#fff;
      font-family:inherit;
      font-size:clamp(.82rem,1.7vh,1.04rem);
      font-weight:700;
      text-decoration:none;
      background:linear-gradient(100deg,#c779e4 0%,#db84b1 48%,#e77b86 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        0 7px 18px rgba(183,89,135,.10);
      -webkit-tap-highlight-color:transparent;
      transition:transform .14s ease,filter .14s ease;
    }

    .instagram svg{
      width:clamp(19px,2.8vh,24px);
      height:clamp(19px,2.8vh,24px);
      fill:none;
      stroke:currentColor;
      stroke-width:2;
    }

    .sr-only{
      position:absolute!important;
      width:1px!important;
      height:1px!important;
      padding:0!important;
      margin:-1px!important;
      overflow:hidden!important;
      clip:rect(0,0,0,0)!important;
      white-space:nowrap!important;
      border:0!important;
    }

    /* 極矮裝置：再壓縮文字與功能區，優先保證整張卡完整出現 */
    @media (max-height:620px){
      .contact-panel{padding:6px 12px 7px}
      .quick-actions{gap:6px;margin-bottom:0}
      .quick{min-height:40px;padding:5px 3px;border-radius:12px}
      .quick svg{width:21px;height:21px}
      .quick-label{display:none}
      .line-bubble{width:22px;height:18px;font-size:.36rem}
      .divider{display:none}
      .instagram{min-height:34px;font-size:.76rem;border-radius:12px}
      .instagram svg{width:18px;height:18px}
      .intro{bottom:8px}
      .name{font-size:1.45rem;margin-bottom:4px}
      .bio{font-size:.64rem;line-height:1.4}
    }

    @media (max-width:340px){
      :root{
        --outer-gap:13px;
      }
    }

    @media (max-width:520px){
      .card{
        width:100%;
        height:100%;
        border-radius:20px;
      }
    }




    /*
      橫向 / 電腦寬螢幕：
      右側改成窄版工具列，四個聯絡方式垂直一排，
      IG 放最下方而且只保留圖示。
    */
    @media (orientation:landscape){
      .card{
        width:100%;
        height:100%;
        max-width:none;
        max-height:none;

        display:grid;
        grid-template-columns:minmax(0,1fr) clamp(136px,10vw,170px);
        grid-template-rows:minmax(0,1fr);

        border-radius:clamp(16px,2vw,26px);
      }

      .hero{
        min-width:0;
        min-height:0;
        height:100%;
      }

      .hero img{
        object-position:center center;
      }

      .intro{
        left:clamp(18px,3vw,44px);
        right:clamp(18px,3vw,44px);
        bottom:clamp(14px,4vh,42px);
      }

      .name{
        font-size:clamp(1.55rem,6.5vh,3.5rem);
      }

      .bio{
        max-width:min(540px,72%);
        font-size:clamp(.68rem,2.6vh,1.1rem);
        line-height:1.48;
      }

      .contact-panel{
        height:100%;
        min-height:0;
        min-width:0;

        /*
          橫向時 5 個按鈕直接平均分成 5 排。
          quick-actions 用 display:contents，所以 Email / Discord /
          LINE / Phone 會和 Instagram 一起參與同一個 grid。
        */
        display:grid;
        grid-template-rows:minmax(0,1fr);

        padding-block:clamp(10px,1.8vh,16px);
        padding-inline:0;

        border-left:0;
        box-shadow:inset 1px 0 rgba(255,255,255,.08);
      }

      .quick-actions{
        width:calc(100% - (var(--toolbar-gap-x) * 2));
        height:100%;
        min-height:0;
        justify-self:center;

        display:grid;
        grid-template-columns:minmax(0,1fr);
        grid-template-rows:repeat(5,minmax(0,1fr));

        gap:clamp(8px,1.35vh,12px);
        margin:0;
      }

      .quick{
        width:100%;
        height:100%;
        min-height:0;
        justify-self:stretch;
        align-self:stretch;

        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:clamp(3px,.8vh,6px);

        padding:4px 2px;
        border-radius:clamp(12px,1.2vw,16px);
      }

      .quick svg{
        width:clamp(22px,4.2vh,31px);
        height:clamp(22px,4.2vh,31px);
      }

      .quick-label{
        font-size:clamp(.50rem,1.45vh,.68rem);
      }

      .line-bubble{
        width:clamp(24px,4.4vh,31px);
        height:clamp(19px,3.6vh,25px);
      }

      .instagram{
        /*
          和上面四顆完全相同的外框尺寸；
          唯一差別是保留粉紫漸層，讓 IG 視覺上突出。
        */
        grid-column:auto;
        width:100%;
        height:100%;
        min-height:0;
        justify-self:stretch;
        align-self:stretch;

        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;

        border-radius:clamp(12px,1.2vw,16px);
        gap:clamp(3px,.8vh,6px);
        padding:4px 2px;
        white-space:nowrap;
      }

      .instagram span{
        display:block;
        color:#fff;
        font-size:clamp(.50rem,1.45vh,.68rem);
        line-height:1;
        font-weight:700;
      }

      .instagram svg{
        width:clamp(22px,4.2vh,31px);
        height:clamp(22px,4.2vh,31px);
        flex:0 0 auto;
      }
    }

    /* 超寬桌面也維持窄工具列，不再把右側放大 */
    @media (orientation:landscape) and (min-width:1200px){
      .card{
        grid-template-columns:minmax(0,1fr) clamp(144px,9vw,178px);
      }

      .contact-panel{
        padding-block:clamp(12px,2vh,18px);
        padding-inline:0;
      }
    }

    /* 很矮的橫向手機：再縮一點，仍維持單欄 */
    @media (orientation:landscape) and (max-height:520px){
      .card{
        grid-template-columns:minmax(0,1fr) clamp(104px,17vw,126px);
      }

      .contact-panel{
        padding-block:6px;
        padding-inline:0;
        gap:4px;
      }

      .quick{
        padding:2px;
        border-radius:10px;
      }

      .quick-label{
        display:none;
      }

      .quick svg{
        width:19px;
        height:19px;
      }

      .line-bubble{
        width:21px;
        height:17px;
        font-size:.34rem;
      }

      .instagram{
        height:100%;
        min-height:0;
        border-radius:10px;
        gap:3px;
        padding:2px;
      }

      .instagram span{
        display:none;
      }

      .instagram svg{
        width:19px;
        height:19px;
      }

      .intro{
        bottom:8px;
      }

      .name{
        font-size:clamp(1.25rem,6vh,1.8rem);
        margin-bottom:3px;
      }

      .bio{
        font-size:clamp(.56rem,2.2vh,.72rem);
        line-height:1.35;
      }
    }


    /*
      手機橫向：
      之前 max-height:620 的通用規則會把標籤全部隱藏，
      而 display:contents 在部分 Android 瀏覽器也會讓 IG 高度異常。
      這裡強制恢復完整五等分與文字。
    */
    @media (orientation:landscape) and (max-height:620px){
      .card{
        grid-template-columns:minmax(0,1fr) clamp(132px,18vw,154px);
      }

      .contact-panel{
        padding-block:7px;
      }

      .quick-actions{
        gap:5px;
      }

      .quick,
      .instagram{
        min-height:0;
        padding:3px 2px;
        border-radius:11px;
      }

      .quick-label,
      .instagram span{
        display:block;
        font-size:clamp(.54rem,2.25vh,.67rem);
        line-height:1;
      }

      .quick svg:not(.brand-gmail):not(.brand-line),
      .instagram svg{
        width:clamp(20px,5.1vh,24px);
        height:clamp(20px,5.1vh,24px);
      }

      .quick svg.brand-gmail{
        width:clamp(23px,5.5vh,27px);
        height:clamp(23px,5.5vh,27px);
      }

      .quick svg.brand-line{
        width:clamp(28px,6.2vh,33px);
        height:clamp(28px,6.2vh,33px);
      }

      .quick svg.brand-gmail{
        transform:scale(.90);
      }

      .quick svg.brand-line{
        transform:none;
      }

      .intro{
        bottom:10px;
      }

      .name{
        font-size:clamp(1.25rem,5.9vh,1.75rem);
        margin-bottom:4px;
      }

      .bio{
        font-size:clamp(.58rem,2.15vh,.72rem);
        line-height:1.38;
      }
    }

    /* 只有極端矮的橫向視窗才隱藏文字。 */
    @media (orientation:landscape) and (max-height:360px){
      .quick-label,
      .instagram span{
        display:none;
      }

      .card{
        grid-template-columns:minmax(0,1fr) clamp(92px,16vw,112px);
      }
    }


    @keyframes photoChange{
      from{opacity:.35;transform:scale(1.035)}
      to{opacity:1;transform:scale(1.01)}
    }

    .hero img.photo-change{
      animation:photoChange .45s ease-out both;
    }



    /*
      圖片層次固定為：
      圖片 -> 灰色漸層 -> 文字

      每張圖片：
      1. 先完整載入
      2. 交叉淡入約 2 秒
      3. 同時做約 5.6 秒的緩慢放大
    */
    .hero{
      isolation:isolate;
    }

    .hero-photo{
      opacity:0;
      z-index:0;
      transform:scale(1.01);
      filter:saturate(.88) brightness(.91) contrast(.96);

      transition:
        opacity 2.05s cubic-bezier(.22,.70,.20,1),
        filter 1.7s ease;

      will-change:opacity,transform,filter;
      backface-visibility:hidden;
      transform-origin:center center;
    }

    .hero-photo.is-active{
      opacity:1;
      z-index:1;
    }

    /*
      放大不再用「從 A 倍數到 B 倍數」的固定 keyframe。
      transform 由 JavaScript 依「速度 + 漸慢」逐幀計算。
    */
    .hero-photo.is-active.is-zooming{
      will-change:transform,opacity,filter;
    }

    .hero-photo.is-waiting{
      opacity:0;
      z-index:0;
      transform:scale(1.01);
      filter:saturate(.84) brightness(.86) contrast(.95) blur(1px);
      animation:none!important;
    }

    /*
      舊照片淡出時保持「當下已經放大的尺寸」，
      不會在切換前突然跳回 1.01x。
      實際 transform 由 JS 在淡出瞬間凍結。
    */
    .hero-photo.is-outgoing{
      opacity:0;
      z-index:0;
      animation:none!important;
    }

    /* 圖片 -> 漸層 -> 文字 */
    .hero::after{
      z-index:2;
    }

    .intro{
      z-index:4;
    }

    @keyframes orientationContentIn{
      from{
        opacity:.18;
        transform:translateY(12px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes orientationPanelIn{
      from{
        opacity:.32;
        transform:translateX(8px);
      }
      to{
        opacity:1;
        transform:translateX(0);
      }
    }

    body.opening-finished .card,
    body.opening-finished .intro,
    body.opening-finished .quick,
    body.opening-finished .instagram{
      animation:none;
      opacity:1;
      transform:none;
    }

    /*
      旋轉期間如果新方向圖片還在下載，
      舊圖片只稍微變柔，不會先消失。
    */
    body.opening-finished .card.orientation-loading .hero-photo.is-active{
      opacity:.96;
      filter:saturate(.87) brightness(.90) contrast(.96);
    }

    body.opening-finished .card.orientation-transition .intro{
      animation:orientationContentIn 1.35s cubic-bezier(.18,.70,.20,1) .22s both !important;
    }

    body.opening-finished .card.orientation-transition .contact-panel{
      animation:orientationPanelIn 1.40s cubic-bezier(.18,.70,.20,1) .18s both !important;
      transform-origin:center;
    }



    .desktop-copy-phone{
      appearance:none;
      -webkit-appearance:none;
      font:inherit;
      cursor:pointer;
    }

    /* ---------------------------------------------------------------
       電腦 / 行動裝置分流
       --------------------------------------------------------------- */
    .mobile-contact-panel{
      display:none!important;
    }

    .device-mobile .desktop-contact-panel{
      display:none!important;
    }

    .device-mobile .mobile-contact-panel{
      display:block!important;
    }

    .device-desktop .mobile-contact-panel{
      display:none!important;
    }

    /*
      手機主畫面：
      Email / Discord / LINE / Instagram 四顆維持原本 quick 風格；
      原本 IG 的全寬位置改成「更多」。
    */
    .mobile-contact-panel .more-trigger{
      appearance:none;
      grid-column:1 / -1;

      min-height:clamp(39px,5.25vh,51px);
      border:1px solid rgba(255,255,255,.10);
      border-radius:clamp(14px,3vw,20px);

      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;

      /*
        手機版「更多」承接原本 IG 的視覺重點。
        Instagram 本身改回一般 quick，不再突出。
      */
      background:linear-gradient(100deg,#c779e4 0%,#db84b1 48%,#e77b86 100%);
      color:#fff;

      font:inherit;
      font-size:clamp(.82rem,1.7vh,1.04rem);
      font-weight:700;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        0 7px 18px rgba(183,89,135,.12);

      -webkit-tap-highlight-color:transparent;
      cursor:pointer;

      transition:
        transform .14s ease,
        filter .14s ease,
        box-shadow .14s ease;
    }

    .mobile-contact-panel .more-trigger:active{
      transform:scale(.975);
      filter:brightness(.96);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 4px 12px rgba(183,89,135,.08);
    }

    .mobile-contact-panel .more-trigger svg{
      width:22px;
      height:22px;
      fill:currentColor;
    }

    /* 行動裝置橫向：5 顆等分，IG 不突出，「更多」也跟其他同尺寸。 */
    @media (orientation:landscape){
      .device-mobile .mobile-contact-panel{
        display:grid!important;
      }

      .device-mobile .mobile-contact-panel .quick-actions{
        grid-template-rows:repeat(5,minmax(0,1fr));
      }

      .device-mobile .mobile-contact-panel .more-trigger{
        grid-column:auto;
        width:100%;
        height:100%;
        min-height:0;

        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:clamp(3px,.8vh,6px);

        padding:4px 2px;
        border-radius:clamp(12px,1.2vw,16px);

        font-size:clamp(.50rem,1.45vh,.68rem);
        line-height:1;
      }

      .device-mobile .mobile-contact-panel .more-trigger svg{
        width:clamp(22px,4.2vh,31px);
        height:clamp(22px,4.2vh,31px);
      }
    }

    @media (orientation:landscape) and (max-height:620px){
      .device-mobile .mobile-contact-panel .more-trigger{
        padding:3px 2px;
        border-radius:11px;
        font-size:clamp(.54rem,2.25vh,.67rem);
      }

      .device-mobile .mobile-contact-panel .more-trigger svg{
        width:clamp(20px,5.1vh,24px);
        height:clamp(20px,5.1vh,24px);
      }
    }

    @media (orientation:landscape) and (max-height:360px){
      .device-mobile .mobile-contact-panel .more-trigger span{
        display:none;
      }
    }

    /* ---------------------------------------------------------------
       更多：原生感 bottom sheet
       --------------------------------------------------------------- */
    .more-overlay{
      position:fixed;
      inset:0;
      z-index:1000;

      display:flex;
      align-items:flex-end;
      justify-content:center;

      padding:
        max(14px,env(safe-area-inset-top))
        max(14px,env(safe-area-inset-right))
        max(14px,env(safe-area-inset-bottom))
        max(14px,env(safe-area-inset-left));

      /*
        overlay 本身不再做淡入動畫。
        class 一加上就立刻可互動，真正的動畫由
        backdrop + sheet 同時開始，避免「選單先跑、背景後糊」。
      */
      visibility:hidden;
      pointer-events:none;
    }

    .more-overlay.open{
      visibility:visible;
      pointer-events:auto;
    }

    .more-backdrop{
      position:absolute;
      inset:0;
      border:0;

      background:rgba(7,10,20,.58);

      /*
        初始：完全不糊、透明。
        open 的同一 frame 內，與 bottom sheet 同時開始 360ms 動畫。
      */
      opacity:0;
      backdrop-filter:blur(0);
      -webkit-backdrop-filter:blur(0);

      transition:
        opacity .36s cubic-bezier(.22,.78,.24,1),
        backdrop-filter .36s cubic-bezier(.22,.78,.24,1),
        -webkit-backdrop-filter .36s cubic-bezier(.22,.78,.24,1);
    }

    .more-overlay.open .more-backdrop{
      opacity:1;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .more-sheet{
      position:relative;
      z-index:1;

      width:min(100%,460px);
      max-height:min(78vh,680px);
      overflow:auto;

      padding:16px;
      padding-bottom:max(16px,env(safe-area-inset-bottom));

      border:1px solid rgba(255,255,255,.12);
      border-radius:26px;

      background:
        linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012)),
        #272d3f;

      box-shadow:0 26px 70px rgba(0,0,0,.48);

      transform:translateY(26px) scale(.985);
      opacity:.5;

      transition:
        transform .36s cubic-bezier(.22,.78,.24,1),
        opacity .36s cubic-bezier(.22,.78,.24,1);
    }

    .more-overlay.open .more-sheet{
      transform:translateY(0) scale(1);
      opacity:1;
    }

    .more-head{
      min-height:48px;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
    }

    .more-kicker{
      margin-bottom:2px;
      color:rgba(255,255,255,.40);
      font-size:.56rem;
      font-weight:800;
      letter-spacing:.16em;
    }

    .more-head h2{
      margin:0;
      color:#fff;
      font-size:1.34rem;
      line-height:1.05;
    }

    .more-close,
    .qr-back{
      width:42px;
      height:42px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;

      display:grid;
      place-items:center;

      background:rgba(255,255,255,.035);
      color:var(--pink);

      -webkit-tap-highlight-color:transparent;
    }

    .more-close svg,
    .qr-back svg{
      width:21px;
      height:21px;
      fill:none;
      stroke:currentColor;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .more-actions{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }

    .more-action{
      appearance:none;
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;

      min-height:92px;
      padding:12px 8px;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:9px;

      background:rgba(255,255,255,.032);
      color:#f6f3f7;
      text-decoration:none;
      font:inherit;
      font-size:.79rem;
      font-weight:650;
      text-align:center;

      box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
      -webkit-tap-highlight-color:transparent;
      transition:transform .14s ease,background .14s ease,border-color .14s ease;
    }

    .more-action:active{
      transform:scale(.97);
      background:rgba(255,255,255,.07);
      border-color:rgba(255,255,255,.13);
    }

    .more-action svg{
      width:27px;
      height:27px;
      fill:none;
      stroke:var(--pink);
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .more-action svg path:first-child[fill]{
      fill:var(--pink);
      stroke:none;
    }

    .more-main[hidden]{
      display:none!important;
    }

    .qr-head-copy{
      text-align:left;
    }

    .copy-toast{
      position:fixed;
      left:50%;
      bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px));
      z-index:1100;

      max-width:min(86vw,360px);
      padding:10px 14px;

      border:1px solid rgba(255,255,255,.11);
      border-radius:999px;

      background:rgba(27,32,48,.92);
      color:#fff;
      box-shadow:0 10px 30px rgba(0,0,0,.32);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);

      font-size:.76rem;
      font-weight:650;
      text-align:center;

      opacity:0;
      transform:translate(-50%,12px);
      pointer-events:none;
      transition:opacity .22s ease,transform .22s ease;
    }

    .copy-toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    @media (orientation:landscape) and (max-height:620px){
      .more-overlay{
        align-items:center;
      }

      .more-sheet{
        width:min(88vw,560px);
        max-height:calc(100vh - 24px);
        border-radius:22px;
        padding:12px;
      }

      .more-head{
        min-height:40px;
        margin-bottom:9px;
      }

      .more-actions{
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:8px;
      }

      .more-action{
        min-height:76px;
        padding:8px 6px;
        gap:6px;
      }

      .more-action svg{
        width:23px;
        height:23px;
      }
    }



    /* ---------------------------------------------------------------
       複製資料子頁
       --------------------------------------------------------------- */
    .copy-view[hidden]{
      display:none!important;
    }

    .copy-view .more-head{
      grid-template-columns:auto minmax(0,1fr) auto;
    }

    .copy-list{
      display:grid;
      gap:9px;
    }

    .copy-row{
      appearance:none;
      width:100%;
      min-height:64px;
      padding:10px 12px;

      border:1px solid rgba(255,255,255,.08);
      border-radius:17px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;

      background:rgba(255,255,255,.032);
      color:#fff;
      font:inherit;
      text-align:left;

      -webkit-tap-highlight-color:transparent;
      transition:transform .14s ease,background .14s ease,border-color .14s ease;
    }

    .copy-row:active{
      transform:scale(.985);
      background:rgba(255,255,255,.07);
      border-color:rgba(255,255,255,.13);
    }

    .copy-meta{
      min-width:0;
      display:grid;
      gap:3px;
    }

    .copy-meta strong{
      font-size:.78rem;
      font-weight:750;
      color:#fff;
    }

    .copy-meta > span{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      color:rgba(255,255,255,.56);
      font-size:.69rem;
    }

    .copy-state{
      flex:0 0 auto;
      min-width:50px;
      padding:6px 9px;

      border-radius:999px;
      background:rgba(255,179,193,.10);
      color:var(--pink);

      font-size:.66rem;
      font-weight:750;
      text-align:center;
    }

    .copy-row.copied .copy-state{
      background:rgba(255,179,193,.18);
      color:#fff;
    }

    /* ---------------------------------------------------------------
       手機照片：左右滑切換、點擊全螢幕
       電腦版不啟用這些事件。
       --------------------------------------------------------------- */
    .device-mobile .hero{
      touch-action:pan-y;
    }

    .photo-viewer{
      position:fixed;
      inset:0;
      z-index:1200;

      display:block;
      width:100%;
      height:100%;
      padding:0;
      overflow:hidden;

      background:#05070d;

      opacity:0;
      visibility:hidden;
      pointer-events:none;

      transition:
        opacity .32s ease,
        visibility .32s ease;
    }

    .photo-viewer.open{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }

    body.viewer-open{
      overflow:hidden;
    }

    /*
      進入瀏覽器 Fullscreen API 後同樣強制填滿整個裝置畫面。
      不支援 Fullscreen API 的手機則使用 fixed inset:0 fallback。
    */
    .photo-viewer:fullscreen,
    .photo-viewer:-webkit-full-screen{
      width:100vw;
      height:100vh;
      background:#05070d;
    }

    .photo-viewer-stage{
      position:absolute;
      inset:0;
      overflow:hidden;
      padding:0;
      touch-action:none;
      background:#05070d;
    }

    .viewer-photo{
      position:absolute;
      inset:0;

      display:block;
      width:100%;
      height:100%;

      /*
        桌布模式：直接填滿整個螢幕。
        超出的部分裁切，而不是留下黑邊。
      */
      object-fit:cover;
      object-position:center;

      opacity:0;
      transform:scale(1.01);
      transform-origin:center center;

      transition:
        opacity 2.05s cubic-bezier(.22,.70,.22,1);

      user-select:none;
      -webkit-user-drag:none;
      will-change:opacity,transform;
    }

    .viewer-photo.is-active{
      opacity:1;
    }

    .viewer-photo.is-outgoing{
      opacity:0;

      /*
        舊照片只做 opacity 淡出，transform 必須完全凍結。
      */
      transition-property:opacity;
    }

    .photo-viewer-topbar{
      position:absolute;
      z-index:4;
      top:max(14px,env(safe-area-inset-top));
      left:max(14px,env(safe-area-inset-left));
      right:max(14px,env(safe-area-inset-right));

      display:flex;
      align-items:center;
      justify-content:space-between;

      pointer-events:none;

      opacity:1;
      transform:translateY(0);

      transition:
        opacity .42s ease,
        transform .42s cubic-bezier(.22,.78,.24,1);
    }

    .photo-viewer-count{
      min-width:58px;
      padding:8px 12px;

      border:1px solid rgba(255,255,255,.13);
      border-radius:999px;

      background:rgba(24,29,43,.48);
      color:rgba(255,255,255,.92);

      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        0 6px 20px rgba(0,0,0,.18);

      font-size:.75rem;
      font-weight:700;
      line-height:1;
      text-align:center;

      pointer-events:auto;
    }

    .photo-viewer-close{
      width:43px;
      height:43px;

      border:1px solid rgba(255,255,255,.13);
      border-radius:50%;

      display:grid;
      place-items:center;

      background:rgba(24,29,43,.48);
      color:#fff;

      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        0 6px 20px rgba(0,0,0,.18);

      cursor:pointer;
      pointer-events:auto;
      -webkit-tap-highlight-color:transparent;
    }

    .photo-viewer-close svg{
      width:20px;
      height:20px;
      fill:none;
      stroke:currentColor;
      stroke-width:2;
      stroke-linecap:round;
    }

    .photo-viewer-controls{
      position:absolute;
      z-index:4;
      left:50%;
      bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px));
      transform:translateX(-50%);

      display:flex;
      align-items:center;
      gap:8px;

      padding:7px;

      border:1px solid rgba(255,255,255,.12);
      border-radius:999px;

      background:rgba(24,29,43,.42);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        0 8px 28px rgba(0,0,0,.24);

      opacity:1;

      transition:
        opacity .42s ease,
        transform .42s cubic-bezier(.22,.78,.24,1);
    }

    /*
      類似 YouTube：
      進入全螢幕 2 秒後，上方張數/關閉與下方控制列一起淡出。
      照片本身的 5 秒計時、慢放大、漸變完全不受影響。
    */
    .photo-viewer.controls-hidden{
      cursor:none;
    }

    .photo-viewer.controls-hidden .photo-viewer-topbar{
      opacity:0;
      transform:translateY(-10px);
      pointer-events:none;
    }

    .photo-viewer.controls-hidden .photo-viewer-controls{
      opacity:0;
      transform:translate(-50%,12px);
      pointer-events:none;
    }

    /*
      手機沒有滑鼠游標，避免 cursor 規則造成任何差異。
    */
    .device-mobile .photo-viewer.controls-hidden{
      cursor:auto;
    }

    .viewer-control{
      --photo-progress:0;

      appearance:none;
      -webkit-appearance:none;
      position:relative;

      width:42px;
      height:42px;

      border:1px solid rgba(255,255,255,.09);
      border-radius:50%;

      display:grid;
      place-items:center;

      background:rgba(255,255,255,.035);
      color:#fff;

      cursor:pointer;
      -webkit-tap-highlight-color:transparent;

      transition:
        transform .14s ease,
        background .16s ease,
        color .16s ease;
    }

    .viewer-control:hover{
      background:rgba(255,255,255,.085);
    }

    .viewer-control:active{
      transform:scale(.91);
    }

    .viewer-control svg{
      grid-area:1 / 1;
      width:18px;
      height:18px;

      fill:none;
      stroke:currentColor;
      stroke-width:2.15;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .viewer-playback-toggle .pause-symbol,
    .viewer-playback-toggle .play-symbol{
      fill:currentColor;
      stroke:none;

      transition:
        opacity .18s ease,
        transform .18s ease;
    }

    .viewer-playback-toggle .play-symbol{
      opacity:0;
      transform:scale(.72);
    }

    .viewer-playback-toggle[aria-pressed="true"]{
      color:var(--pink);
      background:rgba(255,179,193,.10);
    }

    .viewer-playback-toggle[aria-pressed="true"] .pause-symbol{
      opacity:0;
      transform:scale(.72);
    }

    .viewer-playback-toggle[aria-pressed="true"] .play-symbol{
      opacity:1;
      transform:scale(1);
    }

    /*
      5 秒播放進度環：手機、桌面、全螢幕三顆播放鍵共用。
    */
    .playback-toggle,
    .desktop-playback-toggle,
    .viewer-playback-toggle{
      --photo-progress:0;
      position:relative;
      overflow:visible;
    }

    .playback-toggle::before,
    .desktop-playback-toggle::before,
    .viewer-playback-toggle::before{
      content:"";
      position:absolute;
      inset:-4px;
      border-radius:50%;
      padding:2px;

      background:
        conic-gradient(
          var(--pink) calc(var(--photo-progress) * 1turn),
          rgba(255,255,255,.14) 0
        );

      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;

      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask-composite:exclude;

      pointer-events:none;
      opacity:.92;
    }

    @media (max-width:700px){
      .photo-viewer-count{
        font-size:.70rem;
        padding:7px 10px;
      }

      .photo-viewer-close{
        width:40px;
        height:40px;
      }

      .photo-viewer-controls{
        bottom:max(15px,calc(env(safe-area-inset-bottom) + 8px));
        gap:7px;
        padding:6px;
      }

      .viewer-control{
        width:39px;
        height:39px;
      }
    }

    @media (orientation:landscape) and (max-height:620px){
      .copy-list{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:8px;
      }

      .copy-row{
        min-height:57px;
        padding:8px 10px;
      }
    }

    @media (prefers-reduced-motion:reduce){
      .photo-viewer,
      .photo-viewer-stage img,
      .copy-row,
      .photo-viewer-topbar,
      .photo-viewer-controls{
        transition:none!important;
      }
    }



    /* ---------------------------------------------------------------
       手機照片操作提示 / 播放控制
       預設右下角；若與 bio 區域太近，JS 自動切到右上角。
       --------------------------------------------------------------- */
    .hero-mobile-help{
      display:none;
    }

    .device-mobile .hero-mobile-help{
      position:absolute;
      z-index:6;

      /*
        初始先不顯示。JS 會在首屏繪製前同步量測 bio / 提示框，
        決定右下或右上，再加 help-position-ready 顯示。
        這樣不會看到「先右下、再閃到右上」。
      */
      visibility:hidden;
      opacity:0;
      right:clamp(12px,3.4vw,19px);
      bottom:clamp(14px,2.4vh,22px);

      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:7px;

      max-width:min(42%,168px);

      color:rgba(255,255,255,.78);
      text-shadow:
        0 1px 7px rgba(0,0,0,.72),
        0 0 2px rgba(0,0,0,.38);

      pointer-events:auto;

      /*
        位置切換時不要突然跳，讓右下 -> 右上更自然。
      */
      transition:
        opacity .18s ease;
    }

    .device-mobile .hero-mobile-help.help-position-ready{
      visibility:visible;
      opacity:1;
    }

    /*
      初次定位完成後，如果之後因旋轉/字型變化需要換位置，
      才允許做平滑的位置動畫。
    */
    .device-mobile .hero-mobile-help.help-position-ready.help-position-animate{
      transition:
        top .28s cubic-bezier(.22,.78,.24,1),
        bottom .28s cubic-bezier(.22,.78,.24,1),
        transform .28s cubic-bezier(.22,.78,.24,1),
        opacity .18s ease;
    }

    /*
      當 JS 判定右下角會碰到 bio，就切換到右上角。
      top 值避開卡片圓角與照片邊界。
    */
    .device-mobile .hero-mobile-help.help-top-right{
      /*
        右上角模式：上方與右側使用完全相同的安全間距，
        並比上一版更靠近角落。
      */
      --help-corner-gap:clamp(12px,3vw,17px);
      top:var(--help-corner-gap);
      right:var(--help-corner-gap);
      bottom:auto;
    }

    .hero-hint{
      min-width:0;
      display:grid;
      gap:1px;

      font-size:clamp(.54rem,2.0vw,.66rem);
      font-weight:580;
      line-height:1.18;
      text-align:right;
      letter-spacing:.01em;

      opacity:.78;
      pointer-events:none;
    }

    .hero-hint span{
      white-space:nowrap;
    }

    .playback-toggle{
      appearance:none;
      flex:0 0 auto;

      width:clamp(33px,9vw,38px);
      height:clamp(33px,9vw,38px);

      border:1px solid rgba(255,255,255,.18);
      border-radius:50%;

      display:grid;
      place-items:center;

      background:rgba(27,32,48,.46);
      color:#fff;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 5px 18px rgba(0,0,0,.18);

      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);

      -webkit-tap-highlight-color:transparent;
      cursor:pointer;

      transition:
        transform .14s ease,
        background .20s ease,
        border-color .20s ease;
    }

    .playback-toggle:active{
      transform:scale(.92);
    }

    .playback-toggle svg{
      grid-area:1 / 1;
      width:17px;
      height:17px;
      fill:currentColor;

      transition:
        opacity .18s ease,
        transform .18s ease;
    }

    .playback-toggle .play-symbol{
      opacity:0;
      transform:scale(.72);
    }

    .playback-toggle[aria-pressed="true"]{
      background:rgba(255,179,193,.17);
      border-color:rgba(255,179,193,.34);
      color:var(--pink);
    }

    .playback-toggle[aria-pressed="true"] .pause-symbol{
      opacity:0;
      transform:scale(.72);
    }

    .playback-toggle[aria-pressed="true"] .play-symbol{
      opacity:1;
      transform:scale(1);
    }

    /*
      橫向手機：預設直接放右上角，因為照片底部通常更容易
      被姓名/介紹文字佔用。
    */
    @media (orientation:landscape){
      .device-mobile .hero-mobile-help{
        --help-corner-gap:clamp(10px,2.4vh,15px);
        top:var(--help-corner-gap);
        right:var(--help-corner-gap);
        bottom:auto;
        gap:6px;
        max-width:min(40%,165px);
      }

      .device-mobile .hero-hint{
        font-size:clamp(.48rem,1.45vh,.60rem);
      }

      .device-mobile .playback-toggle{
        width:clamp(29px,7vh,35px);
        height:clamp(29px,7vh,35px);
      }

      .device-mobile .playback-toggle svg{
        width:15px;
        height:15px;
      }
    }

    @media (orientation:landscape) and (max-height:360px){
      .device-mobile .hero-hint{
        display:none;
      }
    }



    /* ---------------------------------------------------------------
       電腦版照片控制：放在照片右下角、右側 IG 面板的左邊
       --------------------------------------------------------------- */
    .desktop-photo-controls{
      display:none;
    }

    .device-desktop .desktop-photo-controls{
      position:absolute;
      z-index:7;
      right:clamp(16px,1.35vw,22px);
      bottom:clamp(16px,1.35vw,22px);

      display:flex;
      align-items:center;
      gap:7px;

      padding:6px;

      border:1px solid rgba(255,255,255,.11);
      border-radius:999px;

      background:rgba(26,31,47,.42);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        0 8px 28px rgba(0,0,0,.18);

      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .desktop-photo-control{
      appearance:none;
      -webkit-appearance:none;

      width:clamp(36px,2.55vw,43px);
      height:clamp(36px,2.55vw,43px);

      border:1px solid rgba(255,255,255,.08);
      border-radius:50%;

      display:grid;
      place-items:center;

      background:rgba(255,255,255,.035);
      color:rgba(255,255,255,.90);

      cursor:pointer;
      -webkit-tap-highlight-color:transparent;

      transition:
        transform .14s ease,
        background .16s ease,
        border-color .16s ease,
        color .16s ease;
    }

    .desktop-photo-control:hover{
      background:rgba(255,255,255,.085);
      border-color:rgba(255,255,255,.15);
      color:#fff;
    }

    .desktop-photo-control:active{
      transform:scale(.91);
    }

    .desktop-photo-control svg{
      grid-area:1 / 1;
      width:18px;
      height:18px;
      fill:none;
      stroke:currentColor;
      stroke-width:2.15;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .desktop-playback-toggle .pause-symbol,
    .desktop-playback-toggle .play-symbol{
      fill:currentColor;
      stroke:none;
      transition:
        opacity .18s ease,
        transform .18s ease;
    }

    .desktop-playback-toggle .play-symbol{
      opacity:0;
      transform:scale(.72);
    }

    .desktop-playback-toggle[aria-pressed="true"]{
      color:var(--pink);
      background:rgba(255,179,193,.11);
      border-color:rgba(255,179,193,.24);
    }

    .desktop-playback-toggle[aria-pressed="true"] .pause-symbol{
      opacity:0;
      transform:scale(.72);
    }

    .desktop-playback-toggle[aria-pressed="true"] .play-symbol{
      opacity:1;
      transform:scale(1);
    }

    @media (max-width:900px){
      .device-desktop .desktop-photo-controls{
        right:14px;
        bottom:14px;
        gap:5px;
        padding:5px;
      }

      .desktop-photo-control{
        width:35px;
        height:35px;
      }
    }


    /* 開場動畫 */
    @keyframes cardEnter{
      from{
        opacity:0;
        transform:translateY(18px) scale(.975);
        filter:blur(5px);
      }
      to{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
      }
    }

    @keyframes heroReveal{
      from{
        opacity:.25;
        transform:scale(1.075);
      }
      to{
        opacity:1;
        transform:scale(1.01);
      }
    }

    @keyframes contentRise{
      from{
        opacity:0;
        transform:translateY(14px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes actionPop{
      from{
        opacity:0;
        transform:translateY(10px) scale(.90);
      }
      70%{
        transform:translateY(-1px) scale(1.015);
      }
      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    .card{
      animation:cardEnter .72s cubic-bezier(.22,.78,.24,1) both;
      transform-origin:center center;
    }


    .intro{
      opacity:0;
      animation:contentRise .62s cubic-bezier(.22,.72,.2,1) .24s both;
    }

    .quick{
      opacity:0;
      animation:actionPop .48s cubic-bezier(.22,.72,.2,1) both;
    }

    .quick:nth-child(1){animation-delay:.42s}
    .quick:nth-child(2){animation-delay:.50s}
    .quick:nth-child(3){animation-delay:.58s}
    .quick:nth-child(4){animation-delay:.66s}

    .instagram{
      opacity:0;
      animation:contentRise .55s cubic-bezier(.22,.72,.2,1) .74s both;
    }

    @media (prefers-reduced-motion:reduce){
      .card,
      .intro,
      .quick,
      .instagram{
        animation:none!important;
        transition:none!important;
        opacity:1!important;
        transform:none!important;
        filter:none!important;
      }

      /* 照片仍保留柔和淡入；縮放由 JavaScript 控制。 */
      .hero-photo{
        transition:opacity 2.05s ease!important;
      }
    }

  </style>

  <div class="photo-viewer" id="photo-viewer" aria-hidden="true">
    <div class="photo-viewer-stage" id="photo-viewer-stage">
      <img class="viewer-photo is-active" id="photo-viewer-a" alt="全螢幕照片">
      <img class="viewer-photo" id="photo-viewer-b" alt="" aria-hidden="true">

    <div class="photo-viewer-topbar">
      <div class="photo-viewer-count" id="photo-viewer-count">1 / 1</div>

      <button class="photo-viewer-close" id="photo-viewer-close" type="button" aria-label="關閉全螢幕照片">
        <svg viewBox="0 0 24 24" aria-hidden="true">

    <div class="photo-viewer-controls" aria-label="全螢幕照片播放控制">
      <button class="viewer-control" id="viewer-photo-prev" type="button" aria-label="上一張照片">

          <path d="M15.5 5.5 9 12l6.5 6.5"/>

      <button
        class="viewer-control viewer-playback-toggle"
        id="viewer-playback-toggle"
        type="button"
        aria-label="暫停照片播放"
        aria-pressed="false"
      >
        <svg class="pause-symbol" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7" y="5" width="3.5" height="14" rx="1.3"/>
          <rect x="13.5" y="5" width="3.5" height="14" rx="1.3"/>
        </svg>
        <svg class="play-symbol" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.2 5.8a1.4 1.4 0 0 1 2.12-1.18l8.1 6.2a1.48 1.48 0 0 1 0 2.36l-8.1 6.2A1.4 1.4 0 0 1 8.2 18.2V5.8Z"/>
        </svg>
      </button>

      <button class="viewer-control" id="viewer-photo-next" type="button" aria-label="下一張照片">
        <svg viewBox="0 0 24 24" aria-hidden="true">
