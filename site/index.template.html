<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#151a2d">
  <title>__CARD_NAME__｜個人名片</title>

  <style>
    :root{
      color-scheme: dark;
      --page:#121728;
      --panel:#282e3f;
      --panel2:#252b3b;
      --text:#fff7f6;
      --muted:#e7dfe2;
      --pink:#ffb3c1;
      --line:rgba(255,255,255,.16);
    }

    *{box-sizing:border-box}

    html,body{min-height:100%}

    body{
      margin:0;
      display:grid;
      place-items:center;
      padding:24px 14px;
      color:var(--text);
      font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        radial-gradient(circle at 20% 12%, rgba(111,76,255,.14), transparent 30%),
        radial-gradient(circle at 80% 88%, rgba(255,135,169,.08), transparent 26%),
        var(--page);
      background-size:46px 46px,46px 46px,auto,auto,auto;
    }

    .card{
      width:min(100%, 460px);
      overflow:hidden;
      border-radius:30px;
      border:1px solid rgba(255,255,255,.14);
      background:#202638;
      box-shadow:0 30px 85px rgba(0,0,0,.38);
    }

    .hero{
      position:relative;
      min-height:650px;
      background:#303648;
      overflow:hidden;
    }

    .hero img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center 48%;
      transform:scale(1.015);
      filter:saturate(.88) brightness(.91) contrast(.96);
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(
          180deg,
          rgba(20,24,38,.04) 0%,
          rgba(20,24,38,.07) 42%,
          rgba(20,24,38,.28) 66%,
          rgba(28,32,45,.70) 100%
        ),
        linear-gradient(90deg, rgba(20,24,38,.12), transparent 52%);
      pointer-events:none;
    }

    .intro{
      position:absolute;
      z-index:2;
      left:34px;
      right:28px;
      bottom:36px;
      text-shadow:0 2px 16px rgba(0,0,0,.38);
    }

    .name{
      margin:0 0 16px;
      font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      font-size:44px;
      line-height:1.08;
      font-weight:800;
      letter-spacing:.02em;
    }

    .bio{
      margin:0;
      max-width:365px;
      font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      font-size:17px;
      line-height:1.8;
      letter-spacing:.02em;
      font-weight:500;
      color:#fff8f7;
    }

    .contact-panel{
      padding:28px 32px 34px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,0)),
        var(--panel);
    }

    .quick-actions{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      align-items:center;
      gap:10px;
      margin:0 auto 28px;
    }

    .quick{
      appearance:none;
      border:0;
      background:transparent;
      color:var(--pink);
      text-decoration:none;
      display:grid;
      place-items:center;
      min-height:64px;
      border-radius:18px;
      transition:transform .14s ease, background .14s ease;
      -webkit-tap-highlight-color:transparent;
    }

    .quick:active{
      transform:scale(.94);
      background:rgba(255,255,255,.05);
    }

    .quick svg{
      width:38px;
      height:38px;
      display:block;
      fill:currentColor;
    }

    .quick.line{
      font-weight:900;
    }

    .line-bubble{
      width:40px;
      height:32px;
      border-radius:50%;
      display:grid;
      place-items:center;
      position:relative;
      background:var(--pink);
      color:#2c3142;
      font-size:11px;
      line-height:1;
      letter-spacing:-.03em;
      font-weight:900;
    }

    .line-bubble::after{
      content:"";
      position:absolute;
      right:5px;
      bottom:-5px;
      border-width:6px 2px 0 7px;
      border-style:solid;
      border-color:var(--pink) transparent transparent transparent;
      transform:rotate(-10deg);
    }

    .divider{
      height:1px;
      margin:0 2px 28px;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.22) 12%, rgba(255,255,255,.22) 88%, transparent);
    }

    .instagram{
      min-height:64px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      color:#fff;
      font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      font-size:20px;
      font-weight:700;
      text-decoration:none;
      background:linear-gradient(100deg,#c779e4 0%,#db84b1 48%,#e77b86 100%);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.12), 0 14px 30px rgba(183,89,135,.14);
      transition:transform .14s ease, filter .14s ease;
      -webkit-tap-highlight-color:transparent;
    }

    .instagram:active{
      transform:scale(.985);
      filter:brightness(.96);
    }

    .instagram svg{
      width:28px;
      height:28px;
      fill:none;
      stroke:currentColor;
      stroke-width:2;
    }

    .sr-only{
      position:absolute!important;
      width:1px!important;
      height:1px!important;
      padding:0!important;
      margin:-1px!important;
      overflow:hidden!important;
      clip:rect(0,0,0,0)!important;
      white-space:nowrap!important;
      border:0!important;
    }

    @media (max-width:520px){
      body{
        padding:12px;
        place-items:start center;
      }

      .card{
        border-radius:28px;
      }

      .hero{
        min-height:clamp(580px, 72vh, 720px);
      }

      .intro{
        left:28px;
        right:22px;
        bottom:30px;
      }

      .name{
        font-size:40px;
      }

      .bio{
        font-size:16px;
        line-height:1.85;
      }

      .contact-panel{
        padding:24px 24px 30px;
      }

      .quick svg{
        width:36px;
        height:36px;
      }

      .line-bubble{
        width:38px;
        height:30px;
        font-size:10.5px;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <section class="hero">
      <img src="asset-01.jpg" alt="">
      <div class="intro">
        <h1 class="name">__CARD_NAME__</h1>
        <p class="bio">
          喜歡雨天的氛圍、好聽的音樂，<br>
          以及平凡生活裡的小確幸<br>
          訊息慢回，生活優先 🎧
        </p>
      </div>
    </section>

    <section class="contact-panel" aria-label="聯絡方式">

      <div class="quick-actions">

        <!-- Email -->
        <a class="quick" href="mailto:__CARD_EMAIL__" aria-label="寄 Email">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 5.5A2.5 2.5 0 0 1 5 3h14a2.5 2.5 0 0 1 2.5 2.5v13A2.5 2.5 0 0 1 19 21H5a2.5 2.5 0 0 1-2.5-2.5v-13Zm2.7-.5L12 10.05 18.8 5H5.2Zm14.3 2.05-6.6 4.9a1.5 1.5 0 0 1-1.8 0L4.5 7.05V18.5c0 .28.22.5.5.5h14a.5.5 0 0 0 .5-.5V7.05Z"/>
          </svg>
          <span class="sr-only">Email</span>
        </a>

        <!-- Discord -->
        <a class="quick" href="__CARD_DISCORD_URL__" target="_blank" rel="noopener" aria-label="Discord">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.54 5.34A16.4 16.4 0 0 0 15.44 4l-.5 1.03a15 15 0 0 0-5.86 0L8.56 4a16.4 16.4 0 0 0-4.1 1.34C1.87 9.18 1.17 12.93 1.52 16.63a16.73 16.73 0 0 0 5.03 2.54l1.22-1.68a10.6 10.6 0 0 1-1.92-.92l.47-.37c3.7 1.7 7.73 1.7 11.38 0l.47.37c-.62.36-1.27.67-1.93.92l1.22 1.68a16.63 16.63 0 0 0 5.02-2.54c.42-4.29-.72-8-2.94-11.29ZM8.42 14.38c-1.11 0-2.02-1.03-2.02-2.29s.89-2.3 2.02-2.3 2.04 1.04 2.02 2.3c0 1.26-.9 2.29-2.02 2.29Zm7.16 0c-1.11 0-2.02-1.03-2.02-2.29s.89-2.3 2.02-2.3 2.04 1.04 2.02 2.3c0 1.26-.89 2.29-2.02 2.29Z"/>
          </svg>
          <span class="sr-only">Discord</span>
        </a>

        <!-- LINE -->
        <a class="quick line" href="__CARD_LINE_URL__" target="_blank" rel="noopener" aria-label="LINE">
          <span class="line-bubble" aria-hidden="true">LINE</span>
          <span class="sr-only">LINE</span>
        </a>

        <!-- Phone -->
        <a class="quick" href="tel:__CARD_PHONE__" aria-label="撥打電話">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.62 10.79a15.47 15.47 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.58a1 1 0 0 1-.25 1.02l-2.2 2.19Z"/>
          </svg>
          <span class="sr-only">電話</span>
        </a>

      </div>

      <div class="divider"></div>

      <a class="instagram" href="__CARD_IG_URL__" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4.2"></circle>
          <circle cx="17.4" cy="6.7" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
        <span>Instagram</span>
      </a>

    </section>

  </main>
</body>
</html>
