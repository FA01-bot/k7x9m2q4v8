<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#151a2d">
  <title>__CARD_NAME__｜個人名片</title>


  <style>
    :root{
      color-scheme: dark;
      --page:#121728;
      --panel:#282e3f;
      --text:#fff7f6;
      --pink:#ffb3c1;

      /* JS 會用 visualViewport 的真正可視範圍更新這兩個值 */
      --vwpx:100vw;
      --vhpx:100vh;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--page);
    }

    html{
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }

    body{
      color:var(--text);

      /*
        網頁能要求「系統 UI 字體」，但 Chrome/Safari 不一定會把
        手機主題商店或 OEM 自訂字體暴露給網頁。
      */
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        radial-gradient(circle at 20% 12%, rgba(111,76,255,.14), transparent 30%),
        radial-gradient(circle at 80% 88%, rgba(255,135,169,.08), transparent 26%),
        var(--page);
      background-size:46px 46px,46px 46px,auto,auto,auto;
    }

    .viewport{
      width:var(--vwpx);
      height:var(--vhpx);
      display:grid;
      place-items:center;
      overflow:hidden;
      padding:
        max(6px, env(safe-area-inset-top))
        max(6px, env(safe-area-inset-right))
        max(6px, env(safe-area-inset-bottom))
        max(6px, env(safe-area-inset-left));
    }

    .card{
      /*
        不使用固定 650px/760px 高度。
        整張卡直接以「目前瀏覽器真正可見高度」為上限。
      */
      width:min(calc(var(--vwpx) - 12px),460px);
      height:min(calc(var(--vhpx) - 12px),900px);
      min-height:0;

      display:flex;
      flex-direction:column;
      overflow:hidden;

      border-radius:clamp(18px,3vw,30px);
      border:1px solid rgba(255,255,255,.14);
      background:#202638;
      box-shadow:0 20px 60px rgba(0,0,0,.34);
    }

    .hero{
      position:relative;
      flex:1 1 0;
      min-height:0;
      overflow:hidden;
      background:#303648;
    }

    .hero img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center 48%;
      transform:scale(1.01);
      filter:saturate(.88) brightness(.91) contrast(.96);
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(
          180deg,
          rgba(20,24,38,.02) 0%,
          rgba(20,24,38,.06) 35%,
          rgba(20,24,38,.30) 66%,
          rgba(28,32,45,.80) 100%
        ),
        linear-gradient(90deg,rgba(20,24,38,.10),transparent 58%);
      pointer-events:none;
    }

    .intro{
      position:absolute;
      z-index:2;
      left:clamp(16px,5.8vw,32px);
      right:clamp(16px,5vw,26px);
      bottom:clamp(12px,2.6vh,28px);
      text-shadow:0 2px 14px rgba(0,0,0,.42);
    }

    .name{
      margin:0 0 clamp(5px,1.15vh,11px);
      font-family:inherit;
      font-size:clamp(1.55rem,4.2vh,2.55rem);
      line-height:1.05;
      font-weight:800;
      letter-spacing:.01em;
    }

    .bio{
      margin:0;
      max-width:365px;
      font-family:inherit;
      font-size:clamp(.69rem,1.65vh,.98rem);
      line-height:1.52;
      font-weight:500;
      letter-spacing:.005em;
      color:#fff8f7;
    }

    .contact-panel{
      flex:0 0 auto;
      padding:
        clamp(8px,1.55vh,18px)
        clamp(14px,4.8vw,26px)
        clamp(9px,1.7vh,20px);

      background:
        linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)),
        var(--panel);
    }

    .quick-actions{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      align-items:stretch;
      gap:clamp(7px,2vw,10px);
      margin:0 auto clamp(8px,1.35vh,14px);
    }

    .quick{
      appearance:none;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.035);
      color:var(--pink);
      text-decoration:none;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:clamp(3px,.55vh,5px);

      min-width:0;
      min-height:clamp(48px,6.2vh,60px);
      padding:clamp(6px,.9vh,9px) 4px;

      border-radius:clamp(13px,2.6vw,18px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
      -webkit-tap-highlight-color:transparent;
      transition:transform .14s ease, background .14s ease, border-color .14s ease;
    }

    .quick:active{
      transform:scale(.96);
      background:rgba(255,255,255,.07);
      border-color:rgba(255,255,255,.13);
    }

    .quick svg{
      width:clamp(23px,3.2vh,29px);
      height:clamp(23px,3.2vh,29px);
      display:block;
      flex:0 0 auto;
      fill:currentColor;
    }

    .quick-label{
      display:block;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      color:rgba(255,255,255,.72);
      font-family:inherit;
      font-size:clamp(.55rem,1.05vh,.66rem);
      line-height:1;
      font-weight:600;
      letter-spacing:.01em;
    }

    .line-bubble{
      width:clamp(24px,3.25vh,29px);
      height:clamp(20px,2.65vh,24px);
      border-radius:45% 45% 45% 40%;
      display:grid;
      place-items:center;
      position:relative;
      flex:0 0 auto;
      background:var(--pink);
      color:#2c3142;
      font-family:inherit;
      font-size:clamp(.38rem,.82vh,.49rem);
      line-height:1;
      letter-spacing:-.04em;
      font-weight:900;
    }

    .line-bubble::after{
      content:"";
      position:absolute;
      right:3px;
      bottom:-4px;
      border-width:4px 1px 0 5px;
      border-style:solid;
      border-color:var(--pink) transparent transparent transparent;
      transform:rotate(-9deg);
    }

    .divider{
      height:0;
      margin:0;
    }

    .instagram{
      min-height:clamp(39px,5.25vh,51px);
      border-radius:clamp(14px,3vw,20px);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      color:#fff;
      font-family:inherit;
      font-size:clamp(.82rem,1.7vh,1.04rem);
      font-weight:700;
      text-decoration:none;
      background:linear-gradient(100deg,#c779e4 0%,#db84b1 48%,#e77b86 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        0 7px 18px rgba(183,89,135,.10);
      -webkit-tap-highlight-color:transparent;
      transition:transform .14s ease,filter .14s ease;
    }

    .instagram svg{
      width:clamp(19px,2.8vh,24px);
      height:clamp(19px,2.8vh,24px);
      fill:none;
      stroke:currentColor;
      stroke-width:2;
    }

    .sr-only{
      position:absolute!important;
      width:1px!important;
      height:1px!important;
      padding:0!important;
      margin:-1px!important;
      overflow:hidden!important;
      clip:rect(0,0,0,0)!important;
      white-space:nowrap!important;
      border:0!important;
    }

    /* 極矮裝置：再壓縮文字與功能區，優先保證整張卡完整出現 */
    @media (max-height:620px){
      .contact-panel{padding:6px 12px 7px}
      .quick-actions{gap:6px;margin-bottom:6px}
      .quick{min-height:40px;padding:5px 3px;border-radius:12px}
      .quick svg{width:21px;height:21px}
      .quick-label{display:none}
      .line-bubble{width:22px;height:18px;font-size:.36rem}
      .divider{display:none}
      .instagram{min-height:34px;font-size:.76rem;border-radius:12px}
      .instagram svg{width:18px;height:18px}
      .intro{bottom:8px}
      .name{font-size:1.45rem;margin-bottom:4px}
      .bio{font-size:.64rem;line-height:1.4}
    }

    @media (max-width:520px){
      .card{
        width:calc(var(--vwpx) - 12px);
        height:calc(var(--vhpx) - 12px);
        border-radius:20px;
      }
    }


    /*
      橫向 / 電腦寬螢幕：
      卡片幾乎填滿目前真正可視畫面，左側是照片與介紹，
      右側變成聯絡面板，不再把手機直向版硬拉寬。
    */
    @media (orientation:landscape){
      .viewport{
        padding:
          max(6px, env(safe-area-inset-top))
          max(6px, env(safe-area-inset-right))
          max(6px, env(safe-area-inset-bottom))
          max(6px, env(safe-area-inset-left));
      }

      .card{
        width:calc(var(--vwpx) - 12px);
        height:calc(var(--vhpx) - 12px);
        max-width:none;
        max-height:none;

        display:grid;
        grid-template-columns:minmax(0,1fr) clamp(245px,29vw,390px);
        grid-template-rows:1fr;

        border-radius:clamp(16px,2vw,26px);
      }

      .hero{
        min-width:0;
        min-height:0;
        height:100%;
      }

      .hero img{
        object-position:center center;
      }

      .intro{
        left:clamp(18px,3vw,44px);
        right:clamp(18px,3vw,44px);
        bottom:clamp(14px,4vh,42px);
      }

      .name{
        font-size:clamp(1.55rem,6.5vh,3.5rem);
      }

      .bio{
        max-width:min(540px,70%);
        font-size:clamp(.68rem,2.6vh,1.1rem);
        line-height:1.48;
      }

      .contact-panel{
        height:100%;
        min-width:0;
        display:flex;
        flex-direction:column;
        justify-content:center;
        padding:
          clamp(10px,3vh,28px)
          clamp(12px,2.4vw,30px);
        border-left:1px solid rgba(255,255,255,.08);
      }

      .quick-actions{
        width:100%;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:clamp(7px,1.5vh,12px);
        margin-bottom:clamp(8px,2.4vh,22px);
      }

      .quick{
        min-height:clamp(42px,12vh,82px);
      }

      .quick svg{
        width:clamp(22px,5.7vh,34px);
        height:clamp(22px,5.7vh,34px);
      }

      .quick-label{
        font-size:clamp(.52rem,2.2vh,.72rem);
      }

      .line-bubble{
        width:clamp(24px,5.8vh,32px);
        height:clamp(19px,4.7vh,26px);
      }

      .instagram{
        width:100%;
        min-height:clamp(36px,9.5vh,58px);
      }
    }

    /* 超寬桌面：讓右側功能區不會顯得太巨大 */
    @media (orientation:landscape) and (min-width:1200px){
      .card{
        grid-template-columns:minmax(0,1fr) minmax(320px,24vw);
      }

      .contact-panel{
        padding-left:clamp(24px,3vw,46px);
        padding-right:clamp(24px,3vw,46px);
      }

      .quick{
        min-height:72px;
      }
    }

    /* 橫向手機很矮時，優先完整顯示 */
    @media (orientation:landscape) and (max-height:520px){
      .card{
        grid-template-columns:minmax(0,1fr) clamp(210px,32vw,300px);
      }

      .contact-panel{
        padding:6px 9px;
      }

      .quick-actions{
        gap:5px;
        margin-bottom:5px;
      }

      .quick{
        min-height:36px;
        padding:4px 2px;
      }

      .quick-label{
        display:none;
      }

      .quick svg{
        width:20px;
        height:20px;
      }

      .instagram{
        min-height:32px;
        font-size:.73rem;
      }

      .instagram svg{
        width:17px;
        height:17px;
      }

      .intro{
        bottom:8px;
      }

      .name{
        font-size:clamp(1.25rem,6vh,1.8rem);
        margin-bottom:3px;
      }

      .bio{
        font-size:clamp(.56rem,2.2vh,.72rem);
        line-height:1.35;
      }
    }

    @keyframes photoChange{
      from{opacity:.35;transform:scale(1.035)}
      to{opacity:1;transform:scale(1.01)}
    }

    .hero img.photo-change{
      animation:photoChange .45s ease-out both;
    }

    /* 開場動畫 */
    @keyframes cardEnter{
      from{
        opacity:0;
        transform:translateY(18px) scale(.975);
        filter:blur(5px);
      }
      to{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
      }
    }

    @keyframes heroReveal{
      from{
        opacity:.25;
        transform:scale(1.075);
      }
      to{
        opacity:1;
        transform:scale(1.01);
      }
    }

    @keyframes contentRise{
      from{
        opacity:0;
        transform:translateY(14px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes actionPop{
      from{
        opacity:0;
        transform:translateY(10px) scale(.90);
      }
      70%{
        transform:translateY(-1px) scale(1.015);
      }
      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    .card{
      animation:cardEnter .72s cubic-bezier(.22,.78,.24,1) both;
      transform-origin:center center;
    }

    .hero img{
      animation:heroReveal 1.05s cubic-bezier(.22,.72,.2,1) both;
    }

    .intro{
      opacity:0;
      animation:contentRise .62s cubic-bezier(.22,.72,.2,1) .24s both;
    }

    .quick{
      opacity:0;
      animation:actionPop .48s cubic-bezier(.22,.72,.2,1) both;
    }

    .quick:nth-child(1){animation-delay:.42s}
    .quick:nth-child(2){animation-delay:.50s}
    .quick:nth-child(3){animation-delay:.58s}
    .quick:nth-child(4){animation-delay:.66s}

    .instagram{
      opacity:0;
      animation:contentRise .55s cubic-bezier(.22,.72,.2,1) .74s both;
    }

    @media (prefers-reduced-motion:reduce){
      .card,
      .hero img,
      .intro,
      .quick,
      .instagram{
        animation:none!important;
        opacity:1!important;
        transform:none!important;
        filter:none!important;
      }
    }

  </style>
</head>

<body>
  <div class="viewport">
  <main class="card">
    <section class="hero">
      <img id="hero-photo" src="asset-01.jpg" alt="">
      <div class="intro">
        <h1 class="name">__CARD_NAME__</h1>
        <p class="bio">
          喜歡雨天的氛圍、好聽的音樂，<br>
          以及平凡生活裡的小確幸<br>
          訊息慢回，生活優先 🎧
        </p>
      </div>
    </section>

    <section class="contact-panel" aria-label="聯絡方式">
      <div class="quick-actions">
        <a class="quick" href="mailto:__CARD_EMAIL__" aria-label="寄 Email">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 5.5A2.5 2.5 0 0 1 5 3h14a2.5 2.5 0 0 1 2.5 2.5v13A2.5 2.5 0 0 1 19 21H5a2.5 2.5 0 0 1-2.5-2.5v-13Zm2.7-.5L12 10.05 18.8 5H5.2Zm14.3 2.05-6.6 4.9a1.5 1.5 0 0 1-1.8 0L4.5 7.05V18.5c0 .28.22.5.5.5h14a.5.5 0 0 0 .5-.5V7.05Z"/>
          </svg>
          <span class="quick-label">Email</span><span class="sr-only">Email</span>
        </a>

        <a class="quick" href="__CARD_DISCORD_URL__" target="_blank" rel="noopener" aria-label="Discord">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.54 5.34A16.4 16.4 0 0 0 15.44 4l-.5 1.03a15 15 0 0 0-5.86 0L8.56 4a16.4 16.4 0 0 0-4.1 1.34C1.87 9.18 1.17 12.93 1.52 16.63a16.73 16.73 0 0 0 5.03 2.54l1.22-1.68a10.6 10.6 0 0 1-1.92-.92l.47-.37c3.7 1.7 7.73 1.7 11.38 0l.47.37c-.62.36-1.27.67-1.93.92l1.22 1.68a16.63 16.63 0 0 0 5.02-2.54c.42-4.29-.72-8-2.94-11.29ZM8.42 14.38c-1.11 0-2.02-1.03-2.02-2.29s.89-2.3 2.02-2.3 2.04 1.04 2.02 2.3c0 1.26-.9 2.29-2.02 2.29Zm7.16 0c-1.11 0-2.02-1.03-2.02-2.29s.89-2.3 2.02-2.3 2.04 1.04 2.02 2.3c0 1.26-.89 2.29-2.02 2.29Z"/>
          </svg>
          <span class="quick-label">Discord</span><span class="sr-only">Discord</span>
        </a>

        <a class="quick" href="__CARD_LINE_URL__" target="_blank" rel="noopener" aria-label="LINE">
          <span class="line-bubble" aria-hidden="true">LINE</span>
          <span class="quick-label">LINE</span><span class="sr-only">LINE</span>
        </a>

        <a class="quick" href="tel:__CARD_PHONE__" aria-label="撥打電話">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.62 10.79a15.47 15.47 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.58a1 1 0 0 1-.25 1.02l-2.2 2.19Z"/>
          </svg>
          <span class="quick-label">Phone</span><span class="sr-only">電話</span>
        </a>
      </div>

      <div class="divider"></div>

      <a class="instagram" href="__CARD_IG_URL__" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4.2"></circle>
          <circle cx="17.4" cy="6.7" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
        <span>Instagram</span>
      </a>
    </section>
  </main>
  </div>

  <script src="image-manifest.js"></script>
  <script>
    (() => {
      const root = document.documentElement;
      const photo = document.getElementById("hero-photo");
      let lastMode = null;

      const viewportSize = () => {
        const vv = window.visualViewport;
        return {
          width: Math.round(vv ? vv.width : window.innerWidth),
          height: Math.round(vv ? vv.height : window.innerHeight)
        };
      };

      const updateViewport = () => {
        const {width, height} = viewportSize();
        root.style.setProperty("--vwpx", width + "px");
        root.style.setProperty("--vhpx", height + "px");
        return {width, height};
      };

      const chooseDifferent = (items, mode) => {
        if (!Array.isArray(items) || items.length === 0) return "asset-01.jpg";

        const key = "card-last-photo-" + mode;
        let previous = "";
        try { previous = sessionStorage.getItem(key) || ""; } catch (_) {}

        let choices = items;
        if (items.length > 1 && previous) {
          const filtered = items.filter(x => x !== previous);
          if (filtered.length) choices = filtered;
        }

        const picked = choices[Math.floor(Math.random() * choices.length)];

        try { sessionStorage.setItem(key, picked); } catch (_) {}
        return picked;
      };

      const setPhotoForOrientation = (force = false) => {
        const {width, height} = viewportSize();
        const mode = height >= width ? "portrait" : "landscape";

        if (!force && mode === lastMode) return;
        lastMode = mode;

        const manifest = window.CARD_IMAGES || {};
        const portrait = Array.isArray(manifest.portrait) ? manifest.portrait : [];
        const landscape = Array.isArray(manifest.landscape) ? manifest.landscape : [];

        let pool = mode === "portrait" ? portrait : landscape;

        // 如果某一組還沒放照片，就暫時退回另一組，不讓網站壞掉。
        if (!pool.length) pool = mode === "portrait" ? landscape : portrait;

        const next = chooseDifferent(pool, mode);
        if (!photo || !next) return;

        photo.classList.remove("photo-change");
        photo.src = next;
        void photo.offsetWidth;
        photo.classList.add("photo-change");
      };

      const refresh = () => {
        updateViewport();
        setPhotoForOrientation(false);
      };

      updateViewport();
      setPhotoForOrientation(true);

      window.addEventListener("resize", refresh, {passive:true});
      window.addEventListener("orientationchange", () => {
        setTimeout(() => {
          updateViewport();
          setPhotoForOrientation(true);
        }, 80);
      }, {passive:true});

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", refresh, {passive:true});
        window.visualViewport.addEventListener("scroll", updateViewport, {passive:true});
      }
    })();
  </script>
</body>
</html>
