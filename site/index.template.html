<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#151a2d">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>__CARD_NAME__｜個人名片</title>


  <style>
    :root{
      color-scheme: dark;
      --page:#121728;
      --panel:#282e3f;
      --text:#fff7f6;
      --pink:#ffb3c1;

      /*
        名片永遠跟著目前可視範圍調整，但不貼滿瀏覽器邊界。
        一般手機約 18px，較大的螢幕會自然增加到最多 34px。
      */
      --outer-gap:clamp(18px,3.2vmin,34px);

      /*
        橫向右側工具列左右留白統一用同一個值，
        避免左邊到圖片與右邊到名片邊界看起來不一致。
      */
      --toolbar-gap-x:clamp(12px,1.15vw,16px);

      /* JS 會用 visualViewport 的真正可視範圍更新這兩個值 */
      --vwpx:100vw;
      --vhpx:100vh;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--page);
    }

    html{
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }

    body{
      color:var(--text);

      /*
        網頁能要求「系統 UI 字體」，但 Chrome/Safari 不一定會把
        手機主題商店或 OEM 自訂字體暴露給網頁。
      */
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        radial-gradient(circle at 20% 12%, rgba(111,76,255,.14), transparent 30%),
        radial-gradient(circle at 80% 88%, rgba(255,135,169,.08), transparent 26%),
        var(--page);
      background-size:46px 46px,46px 46px,auto,auto,auto;
    }

    .viewport{
      width:var(--vwpx);
      height:var(--vhpx);
      display:grid;
      place-items:center;
      overflow:hidden;

      /*
        safe-area 與我們自己的外距取較大值。
        所以有瀏海 / 圓角螢幕時也不會貼邊。
      */
      padding:
        max(var(--outer-gap), env(safe-area-inset-top))
        max(var(--outer-gap), env(safe-area-inset-right))
        max(var(--outer-gap), env(safe-area-inset-bottom))
        max(var(--outer-gap), env(safe-area-inset-left));
    }

    .card{
      /*
        直向仍維持最多 460 × 900，
        但寬高改成吃「viewport 扣掉外距後」的可用空間。
      */
      width:min(100%,460px);
      height:min(100%,900px);
      min-height:0;

      display:flex;
      flex-direction:column;
      overflow:hidden;

      border-radius:clamp(18px,3vw,30px);
      border:1px solid rgba(255,255,255,.14);
      background:#202638;
      box-shadow:0 20px 60px rgba(0,0,0,.34);
    }

    .hero{
      position:relative;
      flex:1 1 0;
      min-height:0;
      overflow:hidden;
      background:#303648;
    }

    .hero img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center 48%;
      transform:scale(1.01);
      filter:saturate(.88) brightness(.91) contrast(.96);
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(
          180deg,
          rgba(20,24,38,.01) 0%,
          rgba(20,24,38,.035) 35%,
          rgba(20,24,38,.12) 66%,
          rgba(28,32,45,.46) 100%
        ),
        linear-gradient(90deg,rgba(20,24,38,.10),transparent 58%);
      pointer-events:none;
    }

    .intro{
      position:absolute;
      z-index:2;
      left:clamp(16px,5.8vw,32px);
      right:clamp(16px,5vw,26px);
      bottom:clamp(12px,2.6vh,28px);
      text-shadow:0 2px 14px rgba(0,0,0,.62), 0 0 2px rgba(0,0,0,.22);
    }

    .name{
      margin:0 0 clamp(5px,1.15vh,11px);
      font-family:inherit;
      font-size:clamp(1.55rem,4.2vh,2.55rem);
      line-height:1.05;
      font-weight:800;
      letter-spacing:.01em;
    }

    .bio{
      margin:0;
      max-width:365px;
      font-family:inherit;
      font-size:clamp(.69rem,1.65vh,.98rem);
      line-height:1.52;
      font-weight:500;
      letter-spacing:.005em;
      color:#fff8f7;
    }

    .contact-panel{
      flex:0 0 auto;
      padding:
        clamp(8px,1.55vh,18px)
        clamp(14px,4.8vw,26px)
        clamp(9px,1.7vh,20px);

      background:
        linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)),
        var(--panel);
    }

    .quick-actions{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      align-items:stretch;
      column-gap:clamp(7px,2vw,10px);
      row-gap:clamp(8px,1.35vh,14px);
      margin:0 auto;
    }

    .quick{
      appearance:none;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.035);
      color:var(--pink);
      text-decoration:none;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:clamp(3px,.55vh,5px);

      min-width:0;
      min-height:clamp(48px,6.2vh,60px);
      padding:clamp(6px,.9vh,9px) 4px;

      border-radius:clamp(13px,2.6vw,18px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
      -webkit-tap-highlight-color:transparent;
      transition:transform .14s ease, background .14s ease, border-color .14s ease;
    }

    .quick:active{
      transform:scale(.96);
      background:rgba(255,255,255,.07);
      border-color:rgba(255,255,255,.13);
    }

    .quick svg{
      width:clamp(23px,3.2vh,29px);
      height:clamp(23px,3.2vh,29px);
      display:block;
      flex:0 0 auto;
      fill:currentColor;
    }


    .brand-logo{
      display:block;
      flex:0 0 auto;
      color:var(--pink);
      overflow:visible;
    }

    /*
      品牌圖示統一用同一個視覺框。
      Gmail 略縮、LINE 略放大，讓肉眼大小跟 Discord / Phone 接近。
    */
    .quick svg.brand-gmail{
      width:clamp(24px,4.35vh,29px);
      height:clamp(24px,4.35vh,29px);
      fill:initial;
    }

    .quick svg.brand-line{
      width:clamp(29px,5.0vh,34px);
      height:clamp(29px,5.0vh,34px);
      fill:initial;
    }

    .quick svg.brand-gmail{
      transform:scale(.90);
      transform-origin:center;
    }

    .quick svg.brand-line{
      transform:none;
    }

    .quick-label{
      display:block;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      color:rgba(255,255,255,.72);
      font-family:inherit;
      font-size:clamp(.55rem,1.05vh,.66rem);
      line-height:1;
      font-weight:600;
      letter-spacing:.01em;
    }

    .line-bubble{
      width:clamp(24px,3.25vh,29px);
      height:clamp(20px,2.65vh,24px);
      border-radius:45% 45% 45% 40%;
      display:grid;
      place-items:center;
      position:relative;
      flex:0 0 auto;
      background:var(--pink);
      color:#2c3142;
      font-family:inherit;
      font-size:clamp(.38rem,.82vh,.49rem);
      line-height:1;
      letter-spacing:-.04em;
      font-weight:900;
    }

    .line-bubble::after{
      content:"";
      position:absolute;
      right:3px;
      bottom:-4px;
      border-width:4px 1px 0 5px;
      border-style:solid;
      border-color:var(--pink) transparent transparent transparent;
      transform:rotate(-9deg);
    }

    .divider{
      height:0;
      margin:0;
    }

    .instagram{
      grid-column:1 / -1;
      min-height:clamp(39px,5.25vh,51px);
      border-radius:clamp(14px,3vw,20px);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      color:#fff;
      font-family:inherit;
      font-size:clamp(.82rem,1.7vh,1.04rem);
      font-weight:700;
      text-decoration:none;
      background:linear-gradient(100deg,#c779e4 0%,#db84b1 48%,#e77b86 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        0 7px 18px rgba(183,89,135,.10);
      -webkit-tap-highlight-color:transparent;
      transition:transform .14s ease,filter .14s ease;
    }

    .instagram svg{
      width:clamp(19px,2.8vh,24px);
      height:clamp(19px,2.8vh,24px);
      fill:none;
      stroke:currentColor;
      stroke-width:2;
    }

    .sr-only{
      position:absolute!important;
      width:1px!important;
      height:1px!important;
      padding:0!important;
      margin:-1px!important;
      overflow:hidden!important;
      clip:rect(0,0,0,0)!important;
      white-space:nowrap!important;
      border:0!important;
    }

    /* 極矮裝置：再壓縮文字與功能區，優先保證整張卡完整出現 */
    @media (max-height:620px){
      .contact-panel{padding:6px 12px 7px}
      .quick-actions{gap:6px;margin-bottom:0}
      .quick{min-height:40px;padding:5px 3px;border-radius:12px}
      .quick svg{width:21px;height:21px}
      .quick-label{display:none}
      .line-bubble{width:22px;height:18px;font-size:.36rem}
      .divider{display:none}
      .instagram{min-height:34px;font-size:.76rem;border-radius:12px}
      .instagram svg{width:18px;height:18px}
      .intro{bottom:8px}
      .name{font-size:1.45rem;margin-bottom:4px}
      .bio{font-size:.64rem;line-height:1.4}
    }

    @media (max-width:340px){
      :root{
        --outer-gap:13px;
      }
    }

    @media (max-width:520px){
      .card{
        width:100%;
        height:100%;
        border-radius:20px;
      }
    }




    /*
      橫向 / 電腦寬螢幕：
      右側改成窄版工具列，四個聯絡方式垂直一排，
      IG 放最下方而且只保留圖示。
    */
    @media (orientation:landscape){
      .card{
        width:100%;
        height:100%;
        max-width:none;
        max-height:none;

        display:grid;
        grid-template-columns:minmax(0,1fr) clamp(136px,10vw,170px);
        grid-template-rows:minmax(0,1fr);

        border-radius:clamp(16px,2vw,26px);
      }

      .hero{
        min-width:0;
        min-height:0;
        height:100%;
      }

      .hero img{
        object-position:center center;
      }

      .intro{
        left:clamp(18px,3vw,44px);
        right:clamp(18px,3vw,44px);
        bottom:clamp(14px,4vh,42px);
      }

      .name{
        font-size:clamp(1.55rem,6.5vh,3.5rem);
      }

      .bio{
        max-width:min(540px,72%);
        font-size:clamp(.68rem,2.6vh,1.1rem);
        line-height:1.48;
      }

      .contact-panel{
        height:100%;
        min-height:0;
        min-width:0;

        /*
          橫向時 5 個按鈕直接平均分成 5 排。
          quick-actions 用 display:contents，所以 Email / Discord /
          LINE / Phone 會和 Instagram 一起參與同一個 grid。
        */
        display:grid;
        grid-template-rows:minmax(0,1fr);

        padding-block:clamp(10px,1.8vh,16px);
        padding-inline:0;

        border-left:0;
        box-shadow:inset 1px 0 rgba(255,255,255,.08);
      }

      .quick-actions{
        width:calc(100% - (var(--toolbar-gap-x) * 2));
        height:100%;
        min-height:0;
        justify-self:center;

        display:grid;
        grid-template-columns:minmax(0,1fr);
        grid-template-rows:repeat(5,minmax(0,1fr));

        gap:clamp(8px,1.35vh,12px);
        margin:0;
      }

      .quick{
        width:100%;
        height:100%;
        min-height:0;
        justify-self:stretch;
        align-self:stretch;

        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:clamp(3px,.8vh,6px);

        padding:4px 2px;
        border-radius:clamp(12px,1.2vw,16px);
      }

      .quick svg{
        width:clamp(22px,4.2vh,31px);
        height:clamp(22px,4.2vh,31px);
      }

      .quick-label{
        font-size:clamp(.50rem,1.45vh,.68rem);
      }

      .line-bubble{
        width:clamp(24px,4.4vh,31px);
        height:clamp(19px,3.6vh,25px);
      }

      .instagram{
        /*
          和上面四顆完全相同的外框尺寸；
          唯一差別是保留粉紫漸層，讓 IG 視覺上突出。
        */
        grid-column:auto;
        width:100%;
        height:100%;
        min-height:0;
        justify-self:stretch;
        align-self:stretch;

        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;

        border-radius:clamp(12px,1.2vw,16px);
        gap:clamp(3px,.8vh,6px);
        padding:4px 2px;
        white-space:nowrap;
      }

      .instagram span{
        display:block;
        color:#fff;
        font-size:clamp(.50rem,1.45vh,.68rem);
        line-height:1;
        font-weight:700;
      }

      .instagram svg{
        width:clamp(22px,4.2vh,31px);
        height:clamp(22px,4.2vh,31px);
        flex:0 0 auto;
      }
    }

    /* 超寬桌面也維持窄工具列，不再把右側放大 */
    @media (orientation:landscape) and (min-width:1200px){
      .card{
        grid-template-columns:minmax(0,1fr) clamp(144px,9vw,178px);
      }

      .contact-panel{
        padding-block:clamp(12px,2vh,18px);
        padding-inline:0;
      }
    }

    /* 很矮的橫向手機：再縮一點，仍維持單欄 */
    @media (orientation:landscape) and (max-height:520px){
      .card{
        grid-template-columns:minmax(0,1fr) clamp(104px,17vw,126px);
      }

      .contact-panel{
        padding-block:6px;
        padding-inline:0;
        gap:4px;
      }

      .quick{
        padding:2px;
        border-radius:10px;
      }

      .quick-label{
        display:none;
      }

      .quick svg{
        width:19px;
        height:19px;
      }

      .line-bubble{
        width:21px;
        height:17px;
        font-size:.34rem;
      }

      .instagram{
        height:100%;
        min-height:0;
        border-radius:10px;
        gap:3px;
        padding:2px;
      }

      .instagram span{
        display:none;
      }

      .instagram svg{
        width:19px;
        height:19px;
      }

      .intro{
        bottom:8px;
      }

      .name{
        font-size:clamp(1.25rem,6vh,1.8rem);
        margin-bottom:3px;
      }

      .bio{
        font-size:clamp(.56rem,2.2vh,.72rem);
        line-height:1.35;
      }
    }


    /*
      手機橫向：
      之前 max-height:620 的通用規則會把標籤全部隱藏，
      而 display:contents 在部分 Android 瀏覽器也會讓 IG 高度異常。
      這裡強制恢復完整五等分與文字。
    */
    @media (orientation:landscape) and (max-height:620px){
      .card{
        grid-template-columns:minmax(0,1fr) clamp(132px,18vw,154px);
      }

      .contact-panel{
        padding-block:7px;
      }

      .quick-actions{
        gap:5px;
      }

      .quick,
      .instagram{
        min-height:0;
        padding:3px 2px;
        border-radius:11px;
      }

      .quick-label,
      .instagram span{
        display:block;
        font-size:clamp(.54rem,2.25vh,.67rem);
        line-height:1;
      }

      .quick svg:not(.brand-gmail):not(.brand-line),
      .instagram svg{
        width:clamp(20px,5.1vh,24px);
        height:clamp(20px,5.1vh,24px);
      }

      .quick svg.brand-gmail{
        width:clamp(23px,5.5vh,27px);
        height:clamp(23px,5.5vh,27px);
      }

      .quick svg.brand-line{
        width:clamp(28px,6.2vh,33px);
        height:clamp(28px,6.2vh,33px);
      }

      .quick svg.brand-gmail{
        transform:scale(.90);
      }

      .quick svg.brand-line{
        transform:none;
      }

      .intro{
        bottom:10px;
      }

      .name{
        font-size:clamp(1.25rem,5.9vh,1.75rem);
        margin-bottom:4px;
      }

      .bio{
        font-size:clamp(.58rem,2.15vh,.72rem);
        line-height:1.38;
      }
    }

    /* 只有極端矮的橫向視窗才隱藏文字。 */
    @media (orientation:landscape) and (max-height:360px){
      .quick-label,
      .instagram span{
        display:none;
      }

      .card{
        grid-template-columns:minmax(0,1fr) clamp(92px,16vw,112px);
      }
    }


    @keyframes photoChange{
      from{opacity:.35;transform:scale(1.035)}
      to{opacity:1;transform:scale(1.01)}
    }

    .hero img.photo-change{
      animation:photoChange .45s ease-out both;
    }



    /*
      圖片層次固定為：
      圖片 -> 灰色漸層 -> 文字

      每張圖片：
      1. 先完整載入
      2. 交叉淡入約 2 秒
      3. 同時做約 5.6 秒的緩慢放大
    */
    .hero{
      isolation:isolate;
    }

    .hero-photo{
      opacity:0;
      z-index:0;
      transform:scale(1.01);
      filter:saturate(.88) brightness(.91) contrast(.96);

      transition:
        opacity 2.05s cubic-bezier(.22,.70,.20,1),
        filter 1.7s ease;

      will-change:opacity,transform,filter;
      backface-visibility:hidden;
      transform-origin:center center;
    }

    .hero-photo.is-active{
      opacity:1;
      z-index:1;
    }

    /*
      放大不再用「從 A 倍數到 B 倍數」的固定 keyframe。
      transform 由 JavaScript 依「速度 + 漸慢」逐幀計算。
    */
    .hero-photo.is-active.is-zooming{
      will-change:transform,opacity,filter;
    }

    .hero-photo.is-waiting{
      opacity:0;
      z-index:0;
      transform:scale(1.01);
      filter:saturate(.84) brightness(.86) contrast(.95) blur(1px);
      animation:none!important;
    }

    /*
      舊照片淡出時保持「當下已經放大的尺寸」，
      不會在切換前突然跳回 1.01x。
      實際 transform 由 JS 在淡出瞬間凍結。
    */
    .hero-photo.is-outgoing{
      opacity:0;
      z-index:0;
      animation:none!important;
    }

    /* 圖片 -> 漸層 -> 文字 */
    .hero::after{
      z-index:2;
    }

    .intro{
      z-index:4;
    }

    @keyframes orientationContentIn{
      from{
        opacity:.18;
        transform:translateY(12px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes orientationPanelIn{
      from{
        opacity:.32;
        transform:translateX(8px);
      }
      to{
        opacity:1;
        transform:translateX(0);
      }
    }

    body.opening-finished .card,
    body.opening-finished .intro,
    body.opening-finished .quick,
    body.opening-finished .instagram{
      animation:none;
      opacity:1;
      transform:none;
    }

    /*
      旋轉期間如果新方向圖片還在下載，
      舊圖片只稍微變柔，不會先消失。
    */
    body.opening-finished .card.orientation-loading .hero-photo.is-active{
      opacity:.96;
      filter:saturate(.87) brightness(.90) contrast(.96);
    }

    body.opening-finished .card.orientation-transition .intro{
      animation:orientationContentIn 1.35s cubic-bezier(.18,.70,.20,1) .22s both !important;
    }

    body.opening-finished .card.orientation-transition .contact-panel{
      animation:orientationPanelIn 1.40s cubic-bezier(.18,.70,.20,1) .18s both !important;
      transform-origin:center;
    }

    /* 開場動畫 */
    @keyframes cardEnter{
      from{
        opacity:0;
        transform:translateY(18px) scale(.975);
        filter:blur(5px);
      }
      to{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
      }
    }

    @keyframes heroReveal{
      from{
        opacity:.25;
        transform:scale(1.075);
      }
      to{
        opacity:1;
        transform:scale(1.01);
      }
    }

    @keyframes contentRise{
      from{
        opacity:0;
        transform:translateY(14px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes actionPop{
      from{
        opacity:0;
        transform:translateY(10px) scale(.90);
      }
      70%{
        transform:translateY(-1px) scale(1.015);
      }
      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    .card{
      animation:cardEnter .72s cubic-bezier(.22,.78,.24,1) both;
      transform-origin:center center;
    }


    .intro{
      opacity:0;
      animation:contentRise .62s cubic-bezier(.22,.72,.2,1) .24s both;
    }

    .quick{
      opacity:0;
      animation:actionPop .48s cubic-bezier(.22,.72,.2,1) both;
    }

    .quick:nth-child(1){animation-delay:.42s}
    .quick:nth-child(2){animation-delay:.50s}
    .quick:nth-child(3){animation-delay:.58s}
    .quick:nth-child(4){animation-delay:.66s}

    .instagram{
      opacity:0;
      animation:contentRise .55s cubic-bezier(.22,.72,.2,1) .74s both;
    }

    @media (prefers-reduced-motion:reduce){
      .card,
      .intro,
      .quick,
      .instagram{
        animation:none!important;
        transition:none!important;
        opacity:1!important;
        transform:none!important;
        filter:none!important;
      }

      /* 照片仍保留柔和淡入；縮放由 JavaScript 控制。 */
      .hero-photo{
        transition:opacity 2.05s ease!important;
      }
    }

  </style>
</head>

<body>
  <div class="viewport">
  <main class="card">
    <section class="hero">
      <img id="hero-photo-a" class="hero-photo is-active" alt="">
      <img id="hero-photo-b" class="hero-photo" alt="">
      <div class="intro">
        <h1 class="name">__CARD_NAME__</h1>
        <p class="bio">
          喜歡雨天的氛圍、好聽的音樂，<br>
          以及平凡生活裡的小確幸<br>
          訊息慢回，生活優先 🎧
        </p>
      </div>
    </section>

    <section class="contact-panel" aria-label="聯絡方式">
      <div class="quick-actions">
        <a class="quick" href="mailto:__CARD_EMAIL__" aria-label="寄 Email">
          <svg class="brand-logo brand-gmail" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M2.4 5.1A1.4 1.4 0 0 1 4.5 4L12 9.55 19.5 4a1.4 1.4 0 0 1 2.1 1.1v13.4A1.5 1.5 0 0 1 20.1 20H18V9.25l-6 4.45-6-4.45V20H3.9a1.5 1.5 0 0 1-1.5-1.5V5.1Z"/>
          </svg>
          <span class="quick-label">Email</span><span class="sr-only">Email</span>
        </a>

        <a class="quick" href="__CARD_DISCORD_URL__" target="_blank" rel="noopener" aria-label="Discord">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.54 5.34A16.4 16.4 0 0 0 15.44 4l-.5 1.03a15 15 0 0 0-5.86 0L8.56 4a16.4 16.4 0 0 0-4.1 1.34C1.87 9.18 1.17 12.93 1.52 16.63a16.73 16.73 0 0 0 5.03 2.54l1.22-1.68a10.6 10.6 0 0 1-1.92-.92l.47-.37c3.7 1.7 7.73 1.7 11.38 0l.47.37c-.62.36-1.27.67-1.93.92l1.22 1.68a16.63 16.63 0 0 0 5.02-2.54c.42-4.29-.72-8-2.94-11.29ZM8.42 14.38c-1.11 0-2.02-1.03-2.02-2.29s.89-2.3 2.02-2.3 2.04 1.04 2.02 2.3c0 1.26-.9 2.29-2.02 2.29Zm7.16 0c-1.11 0-2.02-1.03-2.02-2.29s.89-2.3 2.02-2.3 2.04 1.04 2.02 2.3c0 1.26-.89 2.29-2.02 2.29Z"/>
          </svg>
          <span class="quick-label">Discord</span><span class="sr-only">Discord</span>
        </a>

        <a class="quick" href="__CARD_LINE_URL__" target="_blank" rel="noopener" aria-label="LINE">
          <svg class="brand-logo brand-line" viewBox="0 0 36 36" aria-hidden="true">
            <rect x="3.5" y="3.5" width="29" height="24" rx="12" fill="currentColor"/>
            <path d="M18.5 25.6 16.6 33l7.4-6.7Z" fill="currentColor"/>
            <text x="18" y="18.9"
                  text-anchor="middle"
                  font-family="Arial, sans-serif"
                  font-size="7.4"
                  font-weight="900"
                  letter-spacing="-.1"
                  fill="#2c3142">LINE</text>
          </svg>
          <span class="quick-label">LINE</span><span class="sr-only">LINE</span>
        </a>

        <a class="quick" href="tel:__CARD_PHONE__" aria-label="撥打電話">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.62 10.79a15.47 15.47 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.58a1 1 0 0 1-.25 1.02l-2.2 2.19Z"/>
          </svg>
          <span class="quick-label">Phone</span><span class="sr-only">電話</span>
        </a>

        <a class="instagram" href="__CARD_IG_URL__" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4.2"></circle>
            <circle cx="17.4" cy="6.7" r="1" fill="currentColor" stroke="none"></circle>
          </svg>
          <span>Instagram</span>
        </a>
      </div>
    </section>
  </main>
  </div>

  <script>
    (() => {
      const root = document.documentElement;
      const card = document.querySelector(".card");

      const layers = [
        document.getElementById("hero-photo-a"),
        document.getElementById("hero-photo-b")
      ];

      const manifest = __IMAGE_MANIFEST_JSON__;
      const buildId = __IMAGE_BUILD_ID_JSON__;

      const portraitImages = Array.isArray(manifest.portrait) ? manifest.portrait : [];
      const landscapeImages = Array.isArray(manifest.landscape) ? manifest.landscape : [];

      /*
        每張照片依設定速度放大約 5 秒後開始換下一張。
        如果下一張網路還沒載完，舊照片會繼續留著，
        等新照片 decode 完才真正交叉淡化。
      */
      const ZOOM_DURATION = 5000;
      const CROSSFADE_MS = 2050;

      const memoryIndex = {portrait:0, landscape:0};

      let activeLayer = 0;
      let lastMode = null;
      let orientationTimer = 0;
      let transitionTimer = 0;
      let slideshowTimer = 0;
      let loadGeneration = 0;
      let switching = false;

      let zoomFrame = 0;
      let zoomGeneration = 0;

      /*
        這裡控制的是「速度」，不是最後要放大到幾倍。
        初始速度約每秒增加 3.5% 的 scale，
        然後在 5 秒內平滑減速到接近 0。
      */
      const INITIAL_ZOOM_SPEED = 0.035; // scale / second
      const BASE_SCALE = 1.01;

      const viewportSize = () => {
        const vv = window.visualViewport;
        return {
          width: Math.round(vv ? vv.width : window.innerWidth),
          height: Math.round(vv ? vv.height : window.innerHeight)
        };
      };

      const updateViewport = () => {
        const {width, height} = viewportSize();
        root.style.setProperty("--vwpx", width + "px");
        root.style.setProperty("--vhpx", height + "px");
      };

      const currentMode = () => {
        if (window.matchMedia) {
          return window.matchMedia("(orientation: portrait)").matches
            ? "portrait"
            : "landscape";
        }

        const {width, height} = viewportSize();
        return height >= width ? "portrait" : "landscape";
      };

      const versionedUrl = (path) => {
        if (!path) return "";
        const separator = path.includes("?") ? "&" : "?";
        return path + separator + "v=" + encodeURIComponent(buildId);
      };

      /*
        不隨機，照檔名順序循環。
        建議用 01.jpg / 02.jpg / 03.jpg 控制播放順序。
      */
      const nextSequential = (items, mode) => {
        if (!Array.isArray(items) || items.length === 0) return "";

        const key = "card-sequence-" + buildId + "-" + mode;
        let index = memoryIndex[mode] || 0;

        try {
          const saved = Number.parseInt(localStorage.getItem(key) || "0", 10);
          if (Number.isFinite(saved) && saved >= 0) index = saved;
        } catch (_) {}

        const normalized = index % items.length;
        const picked = items[normalized];
        const nextIndex = (normalized + 1) % items.length;

        memoryIndex[mode] = nextIndex;

        try {
          localStorage.setItem(key, String(nextIndex));
        } catch (_) {}

        return picked;
      };

      const peekSequential = (items, mode) => {
        if (!Array.isArray(items) || items.length === 0) return "";

        const key = "card-sequence-" + buildId + "-" + mode;
        let index = memoryIndex[mode] || 0;

        try {
          const saved = Number.parseInt(localStorage.getItem(key) || "0", 10);
          if (Number.isFinite(saved) && saved >= 0) index = saved;
        } catch (_) {}

        return items[index % items.length] || "";
      };

      const poolFor = (mode) => {
        let pool = mode === "portrait" ? portraitImages : landscapeImages;

        if (!pool.length) {
          pool = mode === "portrait" ? landscapeImages : portraitImages;
        }

        return pool;
      };

      const preload = (path) => {
        if (!path) return;

        const img = new Image();
        img.decoding = "async";
        img.src = versionedUrl(path);

        if (typeof img.decode === "function") {
          img.decode().catch(() => {});
        }
      };

      const loadImage = async (url) => {
        const probe = new Image();
        probe.decoding = "async";
        probe.src = url;

        try {
          if (typeof probe.decode === "function") {
            await probe.decode();
          } else {
            await new Promise((resolve, reject) => {
              probe.onload = resolve;
              probe.onerror = reject;
            });
          }
          return true;
        } catch (_) {
          return false;
        }
      };

      const clearSlideshow = () => {
        clearTimeout(slideshowTimer);
        slideshowTimer = 0;
      };

      const stopZoom = () => {
        zoomGeneration += 1;
        if (zoomFrame) {
          cancelAnimationFrame(zoomFrame);
          zoomFrame = 0;
        }
      };

      /*
        速度式慢放大：
        v(t) = INITIAL_ZOOM_SPEED × (1 - t/T)^2

        一開始放大速度比較明顯，之後逐漸變慢。
        沒有設定「一定要放到 1.075x」之類的終點；
        最後尺寸是由速度曲線和 5 秒時間自然積分出來。
      */
      const startRateBasedZoom = (layer) => {
        if (!layer) return;

        stopZoom();

        const myGeneration = ++zoomGeneration;
        const startedAt = performance.now();
        let lastAt = startedAt;
        let scale = BASE_SCALE;

        layer.style.transform = `scale(${scale})`;
        layer.classList.add("is-zooming");

        const frame = (now) => {
          if (
            myGeneration !== zoomGeneration ||
            !layer.classList.contains("is-active")
          ) {
            return;
          }

          const elapsed = Math.min(now - startedAt, ZOOM_DURATION);
          const progress = Math.min(1, elapsed / ZOOM_DURATION);
          const dt = Math.max(0, (now - lastAt) / 1000);
          lastAt = now;

          // quadratic ease-out of velocity: 快 -> 慢 -> 幾乎停止
          const speed = INITIAL_ZOOM_SPEED * Math.pow(1 - progress, 2);
          scale += speed * dt;

          layer.style.transform = `scale(${scale})`;

          if (elapsed < ZOOM_DURATION) {
            zoomFrame = requestAnimationFrame(frame);
          } else {
            zoomFrame = 0;

            /*
              放大 5 秒後才開始換下一張。
              如果網路慢，新圖沒載完，舊圖會維持目前尺寸等候。
            */
            if (!switching && lastMode && !document.hidden) {
              showNextForMode(lastMode, false);
            }
          }
        };

        zoomFrame = requestAnimationFrame(frame);
      };

      const startOrientationAnimation = () => {
        if (!card || !document.body.classList.contains("opening-finished")) return;

        card.classList.remove("orientation-transition");
        void card.offsetWidth;
        card.classList.add("orientation-transition");

        clearTimeout(transitionTimer);
        transitionTimer = window.setTimeout(() => {
          card.classList.remove("orientation-transition");
        }, 1650);
      };

      const startZoom = (layer) => {
        startRateBasedZoom(layer);
      };

      const crossfadeTo = async (path, orientationChange = false) => {
        if (!path) return false;

        clearSlideshow();
        switching = true;

        /*
          切換開始時先停止舊圖的逐幀縮放。
          它會維持「此刻」的大小淡出，不會突然縮回去。
        */
        stopZoom();

        const generation = ++loadGeneration;
        const url = versionedUrl(path);

        if (orientationChange && card) {
          card.classList.add("orientation-loading");
        }

        /*
          先把新圖在背景載完。
          這段時間目前照片仍完整顯示，所以慢網路不會出現空白。
        */
        const loaded = await loadImage(url);

        if (generation !== loadGeneration) {
          switching = false;
          return false;
        }

        if (card) {
          card.classList.remove("orientation-loading");
        }

        if (!loaded) {
          switching = false;
          return false;
        }

        const oldIndex = activeLayer;
        const newIndex = oldIndex === 0 ? 1 : 0;

        const oldLayer = layers[oldIndex];
        const newLayer = layers[newIndex];

        if (!oldLayer || !newLayer) {
          switching = false;
          return false;
        }

        newLayer.classList.remove("is-active", "is-zooming", "is-outgoing");
        newLayer.style.transform = `scale(${BASE_SCALE})`;
        newLayer.classList.add("is-waiting");
        newLayer.src = url;

        /*
          loadImage 已經 decode 過同一 URL；
          這裡再等一次新 layer 本身 decode，避免某些手機第一幀閃一下。
        */
        try {
          if (typeof newLayer.decode === "function") {
            await newLayer.decode();
          }
        } catch (_) {}

        if (generation !== loadGeneration) {
          switching = false;
          return false;
        }

        await new Promise(resolve =>
          requestAnimationFrame(() => requestAnimationFrame(resolve))
        );

        if (orientationChange) {
          startOrientationAnimation();
        }

        /*
          先確保新層還是透明，再於下一 frame 切成 active。
          這樣旋轉時一定看得到約 2 秒的交叉淡入淡出。
        */
        newLayer.classList.remove("is-waiting");
        void newLayer.offsetWidth;

        requestAnimationFrame(() => {
          /*
            先把舊圖此刻的 transform 讀出來並凍結。
            之前會「卡一下」就是因為移除 is-zooming 後，
            transform 立刻從放大的值跳回 scale(1.01)。
          */
          const frozenTransform = getComputedStyle(oldLayer).transform;
          if (frozenTransform && frozenTransform !== "none") {
            oldLayer.style.transform = frozenTransform;
          }

          oldLayer.classList.remove("is-active", "is-zooming");
          oldLayer.classList.add("is-outgoing");

          newLayer.classList.add("is-active");
          activeLayer = newIndex;
          startZoom(newLayer);
        });

        /*
          交叉淡化結束後才清掉舊圖。
          這樣 1.65 秒內兩張照片會同時存在，轉換比較柔順。
        */
        window.setTimeout(() => {
          if (
            activeLayer !== oldIndex &&
            !oldLayer.classList.contains("is-active")
          ) {
            oldLayer.classList.remove("is-outgoing", "is-zooming");
            oldLayer.style.transform = "";
            oldLayer.removeAttribute("src");
          }
        }, CROSSFADE_MS + 260);

        switching = false;
        return true;
      };

      const showNextForMode = async (mode, orientationChange = false) => {
        const pool = poolFor(mode);
        const next = nextSequential(pool, mode);

        if (!next) {
          return;
        }

        await crossfadeTo(next, orientationChange);

        /*
          順序播放的好處是知道下一張是誰，
          可以趁目前圖片顯示的 5 秒先預載。
        */
        preload(peekSequential(pool, mode));

        const otherMode = mode === "portrait" ? "landscape" : "portrait";
        preload(peekSequential(poolFor(otherMode), otherMode));
      };

      const applyOrientationIfChanged = () => {
        updateViewport();

        const mode = currentMode();
        if (mode === lastMode) return;

        clearSlideshow();
        lastMode = mode;
        showNextForMode(mode, true);
      };

      const scheduleOrientationCheck = () => {
        updateViewport();

        clearTimeout(orientationTimer);
        orientationTimer = window.setTimeout(() => {
          applyOrientationIfChanged();
        }, 140);
      };

      /*
        初次開啟：
        第一張 decode 完才出現，然後開始慢慢放大。
      */
      updateViewport();
      lastMode = currentMode();
      showNextForMode(lastMode, false);

      window.setTimeout(() => {
        document.body.classList.add("opening-finished");
      }, 1200);

      /*
        不同手機旋轉會走不同事件，所以多路監聽。
        真正換照片前仍會判斷方向是否真的改變，不會重複跳圖。
      */
      window.addEventListener("orientationchange", scheduleOrientationCheck, {passive:true});
      window.addEventListener("resize", scheduleOrientationCheck, {passive:true});

      const portraitQuery = window.matchMedia
        ? window.matchMedia("(orientation: portrait)")
        : null;

      if (portraitQuery) {
        if (portraitQuery.addEventListener) {
          portraitQuery.addEventListener("change", scheduleOrientationCheck);
        } else if (portraitQuery.addListener) {
          portraitQuery.addListener(scheduleOrientationCheck);
        }
      }

      if (
        window.screen &&
        window.screen.orientation &&
        window.screen.orientation.addEventListener
      ) {
        window.screen.orientation.addEventListener("change", scheduleOrientationCheck);
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", scheduleOrientationCheck, {passive:true});
        window.visualViewport.addEventListener("scroll", updateViewport, {passive:true});
      }

      /*
        分頁切到背景就停止輪播，避免偷偷下載/跑動畫。
        回到網頁後再從目前照片開始計 5 秒。
      */
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          clearSlideshow();
        } else {
          updateViewport();

          const active = layers[activeLayer];
          if (active && active.classList.contains("is-active")) {
            startRateBasedZoom(active);
          }
        }
      });

      window.addEventListener("pageshow", (event) => {
        updateViewport();

        if (event.persisted) {
          scheduleOrientationCheck();

          const active = layers[activeLayer];
          if (active && active.classList.contains("is-active")) {
            startRateBasedZoom(active);
          }
        }
      });
    })();
  </script>
</body>
