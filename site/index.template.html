  <script>
    (() => {
      const root = document.documentElement;
      const card = document.querySelector(".card");
      const hero = document.querySelector(".hero");

      const layers = [
        document.getElementById("hero-photo-a"),
        document.getElementById("hero-photo-b")
      ];

      const viewer = document.getElementById("photo-viewer");
      const viewerStage = document.getElementById("photo-viewer-stage");
      const viewerLayers = [
        document.getElementById("photo-viewer-a"),
        document.getElementById("photo-viewer-b")
      ];
      const viewerClose = document.getElementById("photo-viewer-close");
      const viewerCount = document.getElementById("photo-viewer-count");
      const viewerPlaybackToggle = document.getElementById("viewer-playback-toggle");
      const viewerPrev = document.getElementById("viewer-photo-prev");
      const viewerNext = document.getElementById("viewer-photo-next");

      const playbackToggle = document.getElementById("playback-toggle");
      const desktopPlaybackToggle = document.getElementById("desktop-playback-toggle");
      const desktopPrev = document.getElementById("desktop-photo-prev");
      const desktopNext = document.getElementById("desktop-photo-next");
      const heroHelp = document.querySelector(".hero-mobile-help");
      const bio = document.querySelector(".bio");

      const manifest = __IMAGE_MANIFEST_JSON__;
      const buildId = __IMAGE_BUILD_ID_JSON__;

      const portraitImages = Array.isArray(manifest.portrait) ? manifest.portrait : [];
      const landscapeImages = Array.isArray(manifest.landscape) ? manifest.landscape : [];

      const ZOOM_DURATION = 5000;
      const CROSSFADE_MS = 2050;

      const memoryIndex = {portrait:0, landscape:0};

      let activeLayer = 0;
      let lastMode = null;
      let orientationTimer = 0;
      let transitionTimer = 0;
      let slideshowTimer = 0;
      let loadGeneration = 0;
      let switching = false;

      let zoomFrame = 0;
      let zoomGeneration = 0;
      let viewerOpen = false;
      let viewerActiveLayer = 0;

      /*
        viewerActiveLayer：目前畫面上已經成為主圖的 layer。
        viewerZoomLayerIndex：目前應該接收 Ken Burns 放大 transform 的 layer。
        兩者在 Crossfade 載入期間刻意分開，避免新照片的 scale
        寫到舊照片上，造成「舊照片突然縮小」。
      */
      let viewerZoomLayerIndex = 0;
      let viewerSyncGeneration = 0;

      let nativeViewerFullscreen = false;
      let currentPhotoPath = "";
      let playbackPaused = false;

      /*
        全螢幕控制介面：
        顯示後 2 秒沒有操作就自動淡出。
      */
      let viewerUiHideTimer = 0;
      const VIEWER_UI_HIDE_DELAY = 2000;

      /*
        當前照片真正「播放中」的累積時間。
        暫停、進全螢幕都不增加；恢復後從原本秒數繼續。
      */
      let currentPhotoElapsedMs = 0;

      const clearViewerUiTimer = () => {
        clearTimeout(viewerUiHideTimer);
        viewerUiHideTimer = 0;
      };

      const hideViewerUi = () => {
        if (
          !viewerOpen ||
          !viewer
        ) {
          return;
        }

        viewer.classList.add(
          "controls-hidden"
        );
      };

      const scheduleViewerUiHide = () => {
        clearViewerUiTimer();

        if (
          !viewerOpen ||
          !viewer
        ) {
          return;
        }

        viewerUiHideTimer =
          window.setTimeout(
            hideViewerUi,
            VIEWER_UI_HIDE_DELAY
          );
      };

      const showViewerUi = ({
        restartTimer = true
      } = {}) => {
        if (
          !viewerOpen ||
          !viewer
        ) {
          return;
        }

        viewer.classList.remove(
          "controls-hidden"
        );

        if (restartTimer) {
          scheduleViewerUiHide();
        }
      };

      const progressButtons = () => [
        playbackToggle,
        desktopPlaybackToggle,
        viewerPlaybackToggle
      ].filter(Boolean);

      const updateProgressUI = () => {
        const progress =
          Math.max(
            0,
            Math.min(
              1,
              currentPhotoElapsedMs /
                ZOOM_DURATION
            )
          );

        for (const button of progressButtons()) {
          button.style.setProperty(
            "--photo-progress",
            String(progress)
          );
        }
      };

      const syncViewerScale = (scale) => {
        if (!viewerOpen) return;

        /*
          Crossfade 期間不要碰舊的可見 layer。
          新照片開始播放後，scale 只寫到新的 viewer layer，
          舊照片保持最後一個 transform 直到 opacity 淡完。
        */
        const layer =
          viewerLayers[
            viewerZoomLayerIndex
          ];

        if (!layer) return;

        layer.style.transform =
          `scale(${scale})`;
      };

      const INITIAL_ZOOM_SPEED = 0.035;
      const BASE_SCALE = 1.01;

      const isMobileDevice = () =>
        root.classList.contains("device-mobile");

      const viewportSize = () => {
        const vv = window.visualViewport;
        return {
          width: Math.round(vv ? vv.width : window.innerWidth),
          height: Math.round(vv ? vv.height : window.innerHeight)
        };
      };

      let helpPositionInitialized = false;

      const updateHelpPosition = ({
        animate = true
      } = {}) => {
        if (
          !isMobileDevice() ||
          !heroHelp ||
          !bio ||
          !hero
        ) {
          return;
        }

        /*
          先暫時取消位置動畫，做同步 layout measurement。
          首次執行會在 parser script 執行期間完成，正常情況下
          瀏覽器還沒畫出第一幀，所以使用者不會看到位置跳動。
        */
        heroHelp.classList.remove(
          "help-position-animate"
        );

        const mode = currentMode();

        if (mode === "landscape") {
          heroHelp.classList.add(
            "help-top-right"
          );
        } else {
          /*
            直向先用右下角計算實際矩形。
          */
          heroHelp.classList.remove(
            "help-top-right"
          );

          /*
            getBoundingClientRect() 會強制完成當下 layout，
            因此不需要先 requestAnimationFrame 再量測。
          */
          const helpRect =
            heroHelp.getBoundingClientRect();

          const bioRect =
            bio.getBoundingClientRect();

          const horizontallyOverlaps =
            helpRect.left < bioRect.right + 8 &&
            helpRect.right > bioRect.left - 8;

          const verticallyTooClose =
            helpRect.top < bioRect.bottom + 12 &&
            helpRect.bottom > bioRect.top - 12;

          if (
            horizontallyOverlaps &&
            verticallyTooClose
          ) {
            heroHelp.classList.add(
              "help-top-right"
            );
          }
        }

        /*
          位置決定後才顯示。
        */
        heroHelp.classList.add(
          "help-position-ready"
        );

        if (
          helpPositionInitialized &&
          animate
        ) {
          /*
            下一 frame 才重新開位置 transition，
            避免本次 class 切換本身被動畫到。
          */
          requestAnimationFrame(() => {
            heroHelp.classList.add(
              "help-position-animate"
            );
          });
        } else {
          helpPositionInitialized = true;

          requestAnimationFrame(() => {
            heroHelp.classList.add(
              "help-position-animate"
            );
          });
        }
      };

      const updateViewport = () => {
        const {width, height} = viewportSize();
        root.style.setProperty("--vwpx", width + "px");
        root.style.setProperty("--vhpx", height + "px");

        updateHelpPosition({
          animate:helpPositionInitialized
        });
      };

      const currentMode = () => {
        if (window.matchMedia) {
          return window.matchMedia("(orientation: portrait)").matches
            ? "portrait"
            : "landscape";
        }

        const {width, height} = viewportSize();
        return height >= width ? "portrait" : "landscape";
      };

      const versionedUrl = (path) => {
        if (!path) return "";
        const separator = path.includes("?") ? "&" : "?";
        return path + separator + "v=" + encodeURIComponent(buildId);
      };

      const sequenceKey = (mode) =>
        "card-sequence-" + buildId + "-" + mode;

      const readNextIndex = (items, mode) => {
        if (!Array.isArray(items) || items.length === 0) return 0;

        let index = memoryIndex[mode] || 0;

        try {
          const saved = Number.parseInt(
            localStorage.getItem(sequenceKey(mode)) || "0",
            10
          );

          if (Number.isFinite(saved) && saved >= 0) {
            index = saved;
          }
        } catch (_) {}

        return index % items.length;
      };

      const writeNextIndex = (items, mode, index) => {
        if (!Array.isArray(items) || items.length === 0) return;

        const normalized =
          ((index % items.length) + items.length) % items.length;

        memoryIndex[mode] = normalized;

        try {
          localStorage.setItem(sequenceKey(mode), String(normalized));
        } catch (_) {}
      };

      /*
        一般播放：依檔名自然順序前進。
      */
      const nextSequential = (items, mode) => {
        if (!Array.isArray(items) || items.length === 0) return "";

        const index = readNextIndex(items, mode);
        const picked = items[index];

        writeNextIndex(items, mode, index + 1);
        return picked;
      };

      /*
        向右滑 = 上一張。
        目前儲存的是「下一張的位置」，所以回上一張要往回兩格：
        next=i+1 -> previous=i-1。
      */
      const previousSequential = (items, mode) => {
        if (!Array.isArray(items) || items.length === 0) return "";

        const nextIndex = readNextIndex(items, mode);
        const previousIndex = nextIndex - 2;

        writeNextIndex(items, mode, previousIndex);

        const picked = nextSequential(items, mode);
        return picked;
      };

      const peekSequential = (items, mode) => {
        if (!Array.isArray(items) || items.length === 0) return "";

        const index = readNextIndex(items, mode);
        return items[index] || "";
      };

      const poolFor = (mode) => {
        let pool = mode === "portrait" ? portraitImages : landscapeImages;

        if (!pool.length) {
          pool = mode === "portrait" ? landscapeImages : portraitImages;
        }

        return pool;
      };

      const preload = (path) => {
        if (!path) return;

        const img = new Image();
        img.decoding = "async";
        img.src = versionedUrl(path);

        if (typeof img.decode === "function") {
          img.decode().catch(() => {});
        }
      };

      const loadImage = async (url) => {
        const probe = new Image();
        probe.decoding = "async";
        probe.src = url;

        try {
          if (typeof probe.decode === "function") {
            await probe.decode();
          } else {
            await new Promise((resolve, reject) => {
              probe.onload = resolve;
              probe.onerror = reject;
            });
          }
          return true;
        } catch (_) {
          return false;
        }
      };

      const clearSlideshow = () => {
        clearTimeout(slideshowTimer);
        slideshowTimer = 0;
      };

      const stopZoom = () => {
        zoomGeneration += 1;

        if (zoomFrame) {
          cancelAnimationFrame(zoomFrame);
          zoomFrame = 0;
        }
      };

      const renderedScale = (layer) => {
        if (!layer) return BASE_SCALE;

        const transform = getComputedStyle(layer).transform;

        if (!transform || transform === "none") {
          return BASE_SCALE;
        }

        try {
          const matrix = new DOMMatrixReadOnly(transform);
          const scale = Math.hypot(matrix.a, matrix.b);
          return Number.isFinite(scale) && scale > 0
            ? scale
            : BASE_SCALE;
        } catch (_) {
          const match = transform.match(
            /matrix\(([^,]+),([^,]+),/
          );

          if (!match) return BASE_SCALE;

          const a = Number.parseFloat(match[1]);
          const b = Number.parseFloat(match[2]);
          const scale = Math.hypot(a, b);

          return Number.isFinite(scale) && scale > 0
            ? scale
            : BASE_SCALE;
        }
      };

      const startRateBasedZoom = (
        layer,
        preserveScale = false
      ) => {
        if (
          !layer ||
          playbackPaused
        ) {
          return;
        }

        /*
          如果已經播滿 5 秒，不再重新啟動一個新的 5 秒週期。
          這就是避免反覆暫停/播放讓照片無限放大的關鍵。
        */
        if (
          currentPhotoElapsedMs >=
          ZOOM_DURATION
        ) {
          if (
            !switching &&
            lastMode &&
            !document.hidden
          ) {
            showNextForMode(
              lastMode,
              false,
              1
            );
          }

          return;
        }

        const startingScale =
          preserveScale
            ? renderedScale(layer)
            : BASE_SCALE;

        stopZoom();

        const myGeneration =
          ++zoomGeneration;

        let lastAt =
          performance.now();

        let scale =
          startingScale;

        layer.style.transform =
          `scale(${scale})`;

        layer.classList.add(
          "is-zooming"
        );

        const frame = (now) => {
          if (
            myGeneration !==
              zoomGeneration ||
            !layer.classList.contains(
              "is-active"
            ) ||
            playbackPaused
          ) {
            return;
          }

          const dtMs =
            Math.max(
              0,
              Math.min(
                100,
                now - lastAt
              )
            );

          lastAt = now;

          /*
            累加的是「真正播放中的時間」，不是每次 resume
            都從 0 開始的局部 elapsed。
          */
          currentPhotoElapsedMs =
            Math.min(
              ZOOM_DURATION,
              currentPhotoElapsedMs +
                dtMs
            );

          const progress =
            Math.min(
              1,
              currentPhotoElapsedMs /
                ZOOM_DURATION
            );

          const dt =
            dtMs / 1000;

          const speed =
            INITIAL_ZOOM_SPEED *
            Math.pow(
              1 - progress,
              2
            );

          scale +=
            speed * dt;

          layer.style.transform =
            `scale(${scale})`;

          syncViewerScale(scale);
          updateProgressUI();

          if (
            currentPhotoElapsedMs <
            ZOOM_DURATION
          ) {
            zoomFrame =
              requestAnimationFrame(
                frame
              );
          } else {
            zoomFrame = 0;

            if (
              !switching &&
              !playbackPaused &&
              lastMode &&
              !document.hidden
            ) {
              showNextForMode(
                lastMode,
                false,
                1
              );
            }
          }
        };

        zoomFrame =
          requestAnimationFrame(frame);
      };

      const startOrientationAnimation = () => {
        if (
          !card ||
          !document.body.classList.contains("opening-finished")
        ) {
          return;
        }

        card.classList.remove("orientation-transition");
        void card.offsetWidth;
        card.classList.add("orientation-transition");

        clearTimeout(transitionTimer);

        transitionTimer = window.setTimeout(() => {
          card.classList.remove("orientation-transition");
        }, 1650);
      };

      const startZoom = (layer) => {
        startRateBasedZoom(layer);
      };

      const activePhotoUrl = () => {
        const active = layers[activeLayer];
        return active && active.src ? active.src : "";
      };

      const updateViewerCount = () => {
        if (!viewerCount) return;

        const mode =
          lastMode || currentMode();

        const pool =
          poolFor(mode);

        let index =
          currentPhotoPath
            ? pool.indexOf(
                currentPhotoPath
              )
            : -1;

        if (index < 0) {
          const all =
            [...portraitImages, ...landscapeImages];

          const globalIndex =
            currentPhotoPath
              ? all.indexOf(
                  currentPhotoPath
                )
              : -1;

          if (globalIndex >= 0) {
            viewerCount.textContent =
              `${globalIndex + 1} / ${all.length}`;
            return;
          }
        }

        viewerCount.textContent =
          `${Math.max(0,index) + 1} / ${Math.max(1,pool.length)}`;
      };

      const syncViewerToActive = async ({
        instant = false
      } = {}) => {
        if (!viewerOpen) return;

        const src =
          activePhotoUrl();

        if (!src) return;

        const myGeneration =
          ++viewerSyncGeneration;

        const mainLayer =
          layers[activeLayer];

        const currentScale =
          renderedScale(mainLayer);

        if (instant) {
          const active =
            viewerLayers[
              viewerActiveLayer
            ];

          const other =
            viewerLayers[
              viewerActiveLayer === 0
                ? 1
                : 0
            ];

          /*
            Instant sync（剛進全螢幕）：
            顯示層和 zoom 目標就是同一層。
          */
          viewerZoomLayerIndex =
            viewerActiveLayer;

          if (active) {
            active.src = src;

            active.style.transform =
              `scale(${currentScale})`;

            active.classList.add(
              "is-active"
            );

            active.classList.remove(
              "is-outgoing"
            );
          }

          if (other) {
            other.classList.remove(
              "is-active",
              "is-outgoing"
            );

            other.style.transform =
              "";

            other.removeAttribute(
              "src"
            );
          }

          updateViewerCount();
          return;
        }

        const oldIndex =
          viewerActiveLayer;

        const newIndex =
          oldIndex === 0 ? 1 : 0;

        const oldLayer =
          viewerLayers[oldIndex];

        const newLayer =
          viewerLayers[newIndex];

        if (!oldLayer || !newLayer) {
          return;
        }

        /*
          先凍結舊照片的最後縮放值。
          之後不論新照片 decode 花多久，
          舊照片都不會再收到任何 scale 更新。
        */
        const frozenOld =
          getComputedStyle(
            oldLayer
          ).transform;

        if (
          frozenOld &&
          frozenOld !== "none"
        ) {
          oldLayer.style.transform =
            frozenOld;
        }

        newLayer.classList.remove(
          "is-active",
          "is-outgoing"
        );

        /*
          關鍵修正：
          在 await decode 之前就把 zoom 目標切到 newIndex。
          因此主輪播一開始跑新照片的 5 秒 zoom 時，
          syncViewerScale() 只會改這張尚未淡入的新照片，
          絕對不會把舊照片縮回 BASE_SCALE。
        */
        viewerZoomLayerIndex =
          newIndex;

        newLayer.style.transform =
          `scale(${BASE_SCALE})`;

        newLayer.src = src;

        try {
          if (
            typeof newLayer.decode ===
            "function"
          ) {
            await newLayer.decode();
          }
        } catch (_) {}

        /*
          如果使用者在 decode 期間又切了一張，
          舊 async 結果直接丟掉。
        */
        if (
          !viewerOpen ||
          myGeneration !==
            viewerSyncGeneration
        ) {
          return;
        }

        /*
          新照片此時可能已經在 hidden 狀態下累積了一點 zoom。
          不重設 transform，直接保留目前值開始 Crossfade。
        */
        newLayer.classList.add(
          "is-active"
        );

        oldLayer.classList.remove(
          "is-active"
        );

        oldLayer.classList.add(
          "is-outgoing"
        );

        viewerActiveLayer =
          newIndex;

        updateViewerCount();

        window.setTimeout(() => {
          if (
            myGeneration ===
              viewerSyncGeneration &&
            viewerActiveLayer !==
              oldIndex
          ) {
            oldLayer.classList.remove(
              "is-outgoing"
            );

            oldLayer.style.transform =
              "";

            oldLayer.removeAttribute(
              "src"
            );
          }
        }, CROSSFADE_MS + 260);
      };

      const crossfadeTo = async (path, orientationChange = false) => {
        if (!path) return false;

        clearSlideshow();
        switching = true;
        stopZoom();

        const generation = ++loadGeneration;
        const url = versionedUrl(path);

        if (orientationChange && card) {
          card.classList.add("orientation-loading");
        }

        const loaded = await loadImage(url);

        if (generation !== loadGeneration) {
          switching = false;
          return false;
        }

        if (card) {
          card.classList.remove("orientation-loading");
        }

        if (!loaded) {
          switching = false;
          return false;
        }

        const oldIndex = activeLayer;
        const newIndex = oldIndex === 0 ? 1 : 0;

        const oldLayer = layers[oldIndex];
        const newLayer = layers[newIndex];

        if (!oldLayer || !newLayer) {
          switching = false;
          return false;
        }

        newLayer.classList.remove(
          "is-active",
          "is-zooming",
          "is-outgoing"
        );

        newLayer.style.transform = `scale(${BASE_SCALE})`;
        newLayer.classList.add("is-waiting");
        newLayer.src = url;

        try {
          if (typeof newLayer.decode === "function") {
            await newLayer.decode();
          }
        } catch (_) {}

        if (generation !== loadGeneration) {
          switching = false;
          return false;
        }

        await new Promise(resolve =>
          requestAnimationFrame(() =>
            requestAnimationFrame(resolve)
          )
        );

        if (orientationChange) {
          startOrientationAnimation();
        }

        newLayer.classList.remove("is-waiting");
        void newLayer.offsetWidth;

        requestAnimationFrame(() => {
          const frozenTransform =
            getComputedStyle(oldLayer).transform;

          if (
            frozenTransform &&
            frozenTransform !== "none"
          ) {
            oldLayer.style.transform = frozenTransform;
          }

          oldLayer.classList.remove(
            "is-active",
            "is-zooming"
          );

          oldLayer.classList.add("is-outgoing");

          newLayer.classList.add("is-active");
          activeLayer = newIndex;

          /*
            真正換到新照片才開始新的 5 秒總播放時間。
          */
          currentPhotoPath = path;
          currentPhotoElapsedMs = 0;
          updateProgressUI();

          if (viewerOpen) {
            syncViewerToActive({
              instant:false
            });
          }

          if (!playbackPaused) {
            startZoom(newLayer);
          } else {
            newLayer.style.transform =
              `scale(${BASE_SCALE})`;

            syncViewerScale(
              BASE_SCALE
            );
          }
        });

        window.setTimeout(() => {
          if (
            activeLayer !== oldIndex &&
            !oldLayer.classList.contains("is-active")
          ) {
            oldLayer.classList.remove(
              "is-outgoing",
              "is-zooming"
            );

            oldLayer.style.transform = "";
            oldLayer.removeAttribute("src");
          }
        }, CROSSFADE_MS + 260);

        switching = false;
        return true;
      };

      const showNextForMode = async (
        mode,
        orientationChange = false,
        direction = 1
      ) => {
        if (switching) return false;

        const pool = poolFor(mode);

        const next =
          direction < 0
            ? previousSequential(pool, mode)
            : nextSequential(pool, mode);

        if (!next) return false;

        const changed = await crossfadeTo(
          next,
          orientationChange
        );

        if (!changed) return false;

        preload(peekSequential(pool, mode));

        const otherMode =
          mode === "portrait"
            ? "landscape"
            : "portrait";

        preload(
          peekSequential(
            poolFor(otherMode),
            otherMode
          )
        );

        return true;
      };

      const applyOrientationIfChanged = () => {
        updateViewport();

        const mode = currentMode();
        if (mode === lastMode) return;

        clearSlideshow();
        lastMode = mode;
        showNextForMode(mode, true, 1);
      };

      const scheduleOrientationCheck = () => {
        updateViewport();

        clearTimeout(orientationTimer);

        orientationTimer = window.setTimeout(() => {
          applyOrientationIfChanged();
        }, 140);
      };

      const openViewer = async () => {
        if (
          !viewer ||
          !viewerLayers[0]
        ) {
          return;
        }

        const src =
          activePhotoUrl();

        if (!src) return;

        viewerOpen = true;

        viewerZoomLayerIndex =
          viewerActiveLayer;

        document.body.classList.add(
          "viewer-open"
        );

        viewer.classList.add(
          "open"
        );

        viewer.setAttribute(
          "aria-hidden",
          "false"
        );

        /*
          每次進入全螢幕都先顯示控制，
          然後從此刻開始算 2 秒。
        */
        viewer.classList.remove(
          "controls-hidden"
        );
        scheduleViewerUiHide();

        await syncViewerToActive({
          instant:true
        });

        updateViewerCount();
        updateProgressUI();

        /*
          使用者點擊進入時，支援 Fullscreen API 的瀏覽器
          直接進真正裝置全螢幕；iPhone Safari 等不支援時，
          固定式 overlay 仍會完整覆蓋可視畫面。
        */
        try {
          if (
            !document.fullscreenElement &&
            viewer.requestFullscreen
          ) {
            await viewer.requestFullscreen({
              navigationUI:"hide"
            });

            nativeViewerFullscreen =
              document.fullscreenElement ===
              viewer;
          }
        } catch (_) {
          nativeViewerFullscreen =
            false;
        }
      };

      const closeViewer = async ({
        exitNative = true
      } = {}) => {
        if (
          !viewerOpen ||
          !viewer
        ) {
          return;
        }

        viewerOpen = false;

        /*
          讓所有尚未完成的 viewer decode / crossfade 立即失效。
        */
        viewerSyncGeneration += 1;

        viewer.classList.remove(
          "open"
        );

        viewer.setAttribute(
          "aria-hidden",
          "true"
        );

        clearViewerUiTimer();
        viewer.classList.remove(
          "controls-hidden"
        );

        document.body.classList.remove(
          "viewer-open"
        );

        if (
          exitNative &&
          document.fullscreenElement ===
            viewer &&
          document.exitFullscreen
        ) {
          try {
            await document.exitFullscreen();
          } catch (_) {}
        }

        nativeViewerFullscreen =
          false;
      };

      /*
        手機主照片：
        - 左滑：下一張
        - 右滑：上一張
        - 輕點：全螢幕
      */
      const bindSwipeTarget = (
        target,
        {
          tapToOpen = false,
          stopPropagation = false
        } = {}
      ) => {
        if (!target) return;

        let startX = 0;
        let startY = 0;
        let startedAt = 0;
        let horizontalGesture = false;

        target.addEventListener(
          "touchstart",
          (event) => {
            if (
              !isMobileDevice() ||
              event.touches.length !== 1
            ) {
              return;
            }

            const touch = event.touches[0];

            startX = touch.clientX;
            startY = touch.clientY;
            startedAt = performance.now();
            horizontalGesture = false;
          },
          {passive:true}
        );

        target.addEventListener(
          "touchmove",
          (event) => {
            if (
              !isMobileDevice() ||
              event.touches.length !== 1
            ) {
              return;
            }

            const touch = event.touches[0];
            const dx = touch.clientX - startX;
            const dy = touch.clientY - startY;

            if (
              Math.abs(dx) > 12 &&
              Math.abs(dx) > Math.abs(dy) * 1.2
            ) {
              horizontalGesture = true;
              event.preventDefault();
            }
          },
          {passive:false}
        );

        target.addEventListener(
          "touchend",
          (event) => {
            if (!isMobileDevice()) return;

            if (
              event.target instanceof Element &&
              event.target.closest(".hero-mobile-help")
            ) {
              return;
            }

            const touch =
              event.changedTouches &&
              event.changedTouches[0];

            if (!touch) return;

            const dx = touch.clientX - startX;
            const dy = touch.clientY - startY;
            const elapsed =
              performance.now() - startedAt;

            if (
              horizontalGesture &&
              Math.abs(dx) >= 46 &&
              Math.abs(dx) >
                Math.abs(dy) * 1.15
            ) {
              if (stopPropagation) {
                event.stopPropagation();
              }

              if (viewerOpen) {
                showViewerUi();
              }

              showNextForMode(
                lastMode || currentMode(),
                false,
                dx < 0 ? 1 : -1
              );

              return;
            }

            if (
              tapToOpen &&
              elapsed < 420 &&
              Math.abs(dx) < 12 &&
              Math.abs(dy) < 12
            ) {
              openViewer();
            }
          },
          {passive:true}
        );
      };

      updateViewport();
      lastMode = currentMode();
      showNextForMode(lastMode, false, 1);

      window.setTimeout(() => {
        document.body.classList.add(
          "opening-finished"
        );
      }, 1200);

      window.addEventListener(
        "orientationchange",
        scheduleOrientationCheck,
        {passive:true}
      );

      window.addEventListener(
        "resize",
        scheduleOrientationCheck,
        {passive:true}
      );

      const portraitQuery =
        window.matchMedia
          ? window.matchMedia(
              "(orientation: portrait)"
            )
          : null;

      if (portraitQuery) {
        if (portraitQuery.addEventListener) {
          portraitQuery.addEventListener(
            "change",
            scheduleOrientationCheck
          );
        } else if (portraitQuery.addListener) {
          portraitQuery.addListener(
            scheduleOrientationCheck
          );
        }
      }

      if (
        window.screen &&
        window.screen.orientation &&
        window.screen.orientation.addEventListener
      ) {
        window.screen.orientation.addEventListener(
          "change",
          scheduleOrientationCheck
        );
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener(
          "resize",
          scheduleOrientationCheck,
          {passive:true}
        );

        window.visualViewport.addEventListener(
          "scroll",
          updateViewport,
          {passive:true}
        );
      }

      document.addEventListener(
        "visibilitychange",
        () => {
          if (document.hidden) {
            clearSlideshow();
            stopZoom();
          } else {
            updateViewport();

            const active = layers[activeLayer];

            if (
              !playbackPaused &&
              active &&
              active.classList.contains("is-active")
            ) {
              startRateBasedZoom(active, true);
            }
          }
        }
      );

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready
          .then(updateHelpPosition)
          .catch(() => {});
      }

      window.addEventListener(
        "pageshow",
        (event) => {
          updateViewport();

          if (event.persisted) {
            scheduleOrientationCheck();

            const active = layers[activeLayer];

            if (
              !playbackPaused &&
              active &&
              active.classList.contains("is-active")
            ) {
              startRateBasedZoom(active, true);
            }
          }
        }
      );

      const updatePlaybackButton = () => {
        const pressed =
          playbackPaused ? "true" : "false";

        const label =
          playbackPaused
            ? "繼續照片播放"
            : "暫停照片播放";

        const title =
          playbackPaused
            ? "繼續播放"
            : "暫停播放";

        if (playbackToggle) {
          playbackToggle.setAttribute(
            "aria-pressed",
            pressed
          );

          playbackToggle.setAttribute(
            "aria-label",
            label
          );
        }

        if (desktopPlaybackToggle) {
          desktopPlaybackToggle.setAttribute(
            "aria-pressed",
            pressed
          );

          desktopPlaybackToggle.setAttribute(
            "aria-label",
            label
          );

          desktopPlaybackToggle.title =
            title;
        }

        if (viewerPlaybackToggle) {
          viewerPlaybackToggle.setAttribute(
            "aria-pressed",
            pressed
          );

          viewerPlaybackToggle.setAttribute(
            "aria-label",
            label
          );
        }

        updateProgressUI();
      };

      const setPlaybackPaused = (
        paused
      ) => {
        playbackPaused =
          Boolean(paused);

        updatePlaybackButton();

        const active =
          layers[activeLayer];

        if (playbackPaused) {
          /*
            只停止動畫，不重設 currentPhotoElapsedMs。
            例如已播放 3.2 秒，暫停後仍記住 3.2 秒。
          */
          clearSlideshow();
          stopZoom();
          return;
        }

        if (
          active &&
          active.classList.contains(
            "is-active"
          ) &&
          !document.hidden
        ) {
          /*
            繼續使用當前 scale + 當前累積秒數。
            如果只剩 1.8 秒，就只會再播 1.8 秒，
            絕對不會重新得到一個完整 5 秒。
          */
          startRateBasedZoom(
            active,
            true
          );
        }
      };

      updatePlaybackButton();
      updateProgressUI();

      playbackToggle?.addEventListener(
        "click",
        (event) => {
          event.preventDefault();
          event.stopPropagation();

          setPlaybackPaused(
            !playbackPaused
          );
        }
      );

      desktopPlaybackToggle?.addEventListener(
        "click",
        (event) => {
          event.preventDefault();
          event.stopPropagation();

          setPlaybackPaused(
            !playbackPaused
          );
        }
      );

      desktopPrev?.addEventListener(
        "click",
        (event) => {
          event.preventDefault();
          event.stopPropagation();

          showNextForMode(
            lastMode || currentMode(),
            false,
            -1
          );
        }
      );

      desktopNext?.addEventListener(
        "click",
        (event) => {
          event.preventDefault();
          event.stopPropagation();

          showNextForMode(
            lastMode || currentMode(),
            false,
            1
          );
        }
      );

      viewerPlaybackToggle?.addEventListener(
        "click",
        (event) => {
          event.preventDefault();
          event.stopPropagation();

          setPlaybackPaused(
            !playbackPaused
          );
        }
      );

      viewerPrev?.addEventListener(
        "click",
        (event) => {
          event.preventDefault();
          event.stopPropagation();

          showNextForMode(
            lastMode || currentMode(),
            false,
            -1
          );
        }
      );

      viewerNext?.addEventListener(
        "click",
        (event) => {
          event.preventDefault();
          event.stopPropagation();

          showNextForMode(
            lastMode || currentMode(),
            false,
            1
          );
        }
      );

      /*
        點任何全螢幕控制項，都視為使用者仍在操作：
        先顯示控制，再重新計時 2 秒。
      */
      viewer?.addEventListener(
        "pointerdown",
        (event) => {
          if (
            event.target instanceof Element &&
            event.target.closest(
              ".photo-viewer-topbar, .photo-viewer-controls"
            )
          ) {
            showViewerUi();
          }
        },
        true
      );

      viewerClose?.addEventListener(
        "click",
        (event) => {
          event.preventDefault();
          event.stopPropagation();
          closeViewer();
        }
      );

      /*
        桌面版：滑鼠只要移回全螢幕畫面，就像 YouTube 一樣
        立即把控制列叫回來，停止移動 2 秒後再淡出。
      */
      viewer?.addEventListener(
        "mousemove",
        () => {
          if (!viewerOpen) return;
          showViewerUi();
        },
        {passive:true}
      );

      /*
        手機版：控制列已隱藏時，輕點桌布一次只負責叫回 UI，
        不會觸發其他操作；顯示後再過 2 秒自動淡出。
      */
      viewerStage?.addEventListener(
        "click",
        (event) => {
          if (
            !viewerOpen ||
            !viewer
          ) {
            return;
          }

          if (
            event.target instanceof Element &&
            event.target.closest(
              ".photo-viewer-topbar, .photo-viewer-controls"
            )
          ) {
            return;
          }

          if (
            viewer.classList.contains(
              "controls-hidden"
            )
          ) {
            event.preventDefault();
            event.stopPropagation();
            showViewerUi();
          } else {
            /*
              UI 本來就顯示時，點一下桌布不做動作，
              只重置 2 秒倒數，避免誤操作。
            */
            scheduleViewerUiHide();
          }
        }
      );

      document.addEventListener(
        "fullscreenchange",
        () => {
          if (
            nativeViewerFullscreen &&
            viewerOpen &&
            !document.fullscreenElement
          ) {
            nativeViewerFullscreen = false;
            clearViewerUiTimer();

            closeViewer({
              exitNative:false
            });
          }
        }
      );

      if (
        root.classList.contains(
          "device-desktop"
        ) &&
        hero
      ) {
        hero.style.cursor =
          "zoom-in";

        hero.addEventListener(
          "click",
          (event) => {
            if (
              event.target instanceof Element &&
              event.target.closest(
                ".desktop-photo-controls"
              )
            ) {
              return;
            }

            openViewer();
          }
        );

        document.addEventListener(
          "keydown",
          (event) => {
            const target =
              event.target;

            const interactive =
              target instanceof Element &&
              target.closest(
                "input,textarea,select,[contenteditable='true']"
              );

            if (interactive) return;

            if (
              event.key === "ArrowLeft"
            ) {
              event.preventDefault();

              if (viewerOpen) {
                showViewerUi();
              }

              showNextForMode(
                lastMode || currentMode(),
                false,
                -1
              );

              return;
            }

            if (
              event.key === "ArrowRight"
            ) {
              event.preventDefault();

              if (viewerOpen) {
                showViewerUi();
              }

              showNextForMode(
                lastMode || currentMode(),
                false,
                1
              );

              return;
            }

            if (
              event.code === "Space"
            ) {
              event.preventDefault();

              if (viewerOpen) {
                showViewerUi();
              }

              setPlaybackPaused(
                !playbackPaused
              );

              return;
            }

            if (
              event.key === "Escape" &&
              viewerOpen
            ) {
              event.preventDefault();
              closeViewer();
            }
          }
        );
      }

      if (isMobileDevice()) {
        bindSwipeTarget(hero, {
          tapToOpen:true
        });

        bindSwipeTarget(viewerStage, {
          tapToOpen:false,
          stopPropagation:true
        });

        document.addEventListener(
          "keydown",
          (event) => {
            if (
              event.key === "Escape" &&
              viewerOpen
            ) {
              closeViewer();
            }
          }
        );
      }
    })();
  </script>

  <script>
    (() => {
      const overlay =
        document.getElementById("more-overlay");

      const trigger =
        document.getElementById("more-trigger");

      const backdrop =
        document.getElementById("more-backdrop");

      const closeBtn =
        document.getElementById("more-close");

      const main =
        document.getElementById("more-main");

      const copyView =
        document.getElementById("copy-view");

      const copyDataBtn =
        document.getElementById("copy-data");

      const copyBack =
        document.getElementById("copy-back");

      const copyClose =
        document.getElementById("copy-close");

      const shareBtn =
        document.getElementById("share-card");

      const addContactBtn =
        document.getElementById("add-contact");

      const toast =
        document.getElementById("copy-toast");

      if (!overlay || !trigger) return;

      let toastTimer = 0;

      const isMobile =
        document.documentElement.classList.contains(
          "device-mobile"
        );

      const showToast = (text) => {
        if (!toast) return;

        toast.textContent = text;
        toast.classList.remove("show");
        void toast.offsetWidth;
        toast.classList.add("show");

        clearTimeout(toastTimer);

        toastTimer = window.setTimeout(() => {
          toast.classList.remove("show");
        }, 1800);
      };

      const copyText = async (
        text,
        successText
      ) => {
        try {
          if (
            navigator.clipboard &&
            window.isSecureContext
          ) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta =
              document.createElement("textarea");

            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.opacity = "0";

            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            ta.remove();
          }

          showToast(successText);
          return true;
        } catch (_) {
          showToast(
            "無法自動複製，請手動複製"
          );

          return false;
        }
      };

      const showMain = () => {
        main.hidden = false;
        copyView.hidden = true;
      };

      const openSheet = () => {
        showMain();

        overlay.classList.add("open");
        overlay.setAttribute(
          "aria-hidden",
          "false"
        );

        window.setTimeout(() => {
          closeBtn?.focus({
            preventScroll:true
          });
        }, 80);
      };

      const closeSheet = () => {
        overlay.classList.remove("open");
        overlay.setAttribute(
          "aria-hidden",
          "true"
        );

        window.setTimeout(showMain, 360);
      };

      const openCopy = () => {
        main.hidden = true;
        copyView.hidden = false;

        copyBack?.focus({
          preventScroll:true
        });
      };

      const backToMain = (
        focusTarget = null
      ) => {
        showMain();

        focusTarget?.focus({
          preventScroll:true
        });
      };

      trigger.addEventListener(
        "click",
        openSheet
      );

      backdrop?.addEventListener(
        "click",
        closeSheet
      );

      closeBtn?.addEventListener(
        "click",
        closeSheet
      );

      copyClose?.addEventListener(
        "click",
        closeSheet
      );

      copyBack?.addEventListener(
        "click",
        () => backToMain(copyDataBtn)
      );

      copyDataBtn?.addEventListener(
        "click",
        openCopy
      );

      /*
        加入聯絡人只存在手機版。
        不使用 download=，讓瀏覽器直接把 contact.vcf
        交給 iOS / Android 的 vCard 處理流程。
      */
      addContactBtn?.addEventListener(
        "click",
        () => {
          window.location.assign(
            "contact.vcf"
          );
        }
      );

      shareBtn?.addEventListener(
        "click",
        async () => {
          if (navigator.share) {
            try {
              await navigator.share({
                title:document.title,
                text:"__CARD_NAME__ 的數位名片",
                url:location.href
              });

              return;
            } catch (error) {
              if (
                error &&
                error.name === "AbortError"
              ) {
                return;
              }
            }
          }

          await copyText(
            location.href,
            "此裝置不支援分享，已複製網址"
          );
        }
      );

      /*
        複製資料：
        Instagram 顯示與複製帳號名稱，而不是整條網址。
        LINE ID 使用 CARD_LINE_ID Secret。
      */
      const instagramHandleFromUrl = (
        value
      ) => {
        try {
          const url = new URL(value);
          const part =
            url.pathname
              .split("/")
              .filter(Boolean)[0];

          return part
            ? "@" + decodeURIComponent(part)
            : value;
        } catch (_) {
          return value;
        }
      };

      const instagramRow =
        document.getElementById(
          "copy-instagram-row"
        );

      if (instagramRow) {
        const raw =
          instagramRow.dataset.copyValue || "";

        const handle =
          instagramHandleFromUrl(raw);

        instagramRow.dataset.copyValue =
          handle.replace(/^@/, "");

        const label =
          instagramRow.querySelector(
            ".copy-instagram-value"
          );

        if (label) {
          label.textContent = handle;
        }
      }

      document
        .querySelectorAll(".copy-row")
        .forEach((row) => {
          row.addEventListener(
            "click",
            async () => {
              const value =
                row.dataset.copyValue || "";

              const label =
                row.dataset.copyLabel ||
                "資料";

              if (!value) return;

              const ok =
                await copyText(
                  value,
                  label + "已複製"
                );

              if (!ok) return;

              const state =
                row.querySelector(
                  ".copy-state"
                );

              const oldText =
                state?.textContent ||
                "複製";

              row.classList.add("copied");

              if (state) {
                state.textContent =
                  "✓ 已複製";
              }

              window.setTimeout(() => {
                row.classList.remove(
                  "copied"
                );

                if (state) {
                  state.textContent =
                    oldText;
                }
              }, 1200);
            }
          );
        });

      /*
        App 智慧開啟（只套用手機版）：
        不用已被 LINE 官方淘汰的 line:// custom scheme。
        改為在同一分頁導向官方 HTTPS / Universal Link；
        已安裝 App 時交給手機 OS 開 App，沒有 App 就留在網頁。
        電腦版完全不掛這段事件。
      */
      if (isMobile) {
        document
          .querySelectorAll(
            ".mobile-contact-panel a[href^='http']"
          )
          .forEach((link) => {
            link.removeAttribute("target");

            link.addEventListener(
              "click",
              (event) => {
                if (
                  event.defaultPrevented ||
                  event.metaKey ||
                  event.ctrlKey ||
                  event.shiftKey ||
                  event.altKey
                ) {
                  return;
                }

                event.preventDefault();
                window.location.assign(
                  link.href
                );
              }
            );
          });
      }

      document.addEventListener(
        "keydown",
        (event) => {
          if (
            event.key !== "Escape" ||
            !overlay.classList.contains(
              "open"
            )
          ) {
            return;
          }

          if (!copyView.hidden) {
            backToMain(copyDataBtn);
            return;
          }

          closeSheet();
        }
      );
    })();
  </script>


  <script>
    (() => {
      const root = document.documentElement;
      const phoneButton = document.getElementById("desktop-copy-phone");
      const toast = document.getElementById("copy-toast");

      if (
        !phoneButton ||
        !root.classList.contains("device-desktop")
      ) {
        return;
      }

      let toastTimer = 0;

      const showToast = (text) => {
        if (!toast) return;

        toast.textContent = text;
        toast.classList.remove("show");
        void toast.offsetWidth;
        toast.classList.add("show");

        clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => {
          toast.classList.remove("show");
        }, 1600);
      };

      const copyText = async (text) => {
        try {
          if (
            navigator.clipboard &&
            window.isSecureContext
          ) {
            await navigator.clipboard.writeText(text);
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.setAttribute("readonly", "");
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            textarea.remove();
          }
          return true;
        } catch (_) {
          return false;
        }
      };

      phoneButton.addEventListener("click", async () => {
        const phone = phoneButton.dataset.phone || "";
        if (!phone) return;

        const ok = await copyText(phone);

        if (ok) {
          showToast("電話號碼已複製");

          const label = phoneButton.querySelector(".quick-label");
          const oldText = label?.textContent || "Phone";

          if (label) label.textContent = "Copied";

          window.setTimeout(() => {
            if (label) label.textContent = oldText;
          }, 1000);
        } else {
          showToast("無法自動複製");
        }
      });
    })();
  </script>
