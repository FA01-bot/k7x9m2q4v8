<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#151a2d">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>__CARD_NAME__｜個人名片</title>


  <style>
    :root{
      color-scheme: dark;
      --page:#121728;
      --panel:#282e3f;
      --text:#fff7f6;
      --pink:#ffb3c1;

      /* JS 會用 visualViewport 的真正可視範圍更新這兩個值 */
      --vwpx:100vw;
      --vhpx:100vh;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--page);
    }

    html{
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }

    body{
      color:var(--text);

      /*
        網頁能要求「系統 UI 字體」，但 Chrome/Safari 不一定會把
        手機主題商店或 OEM 自訂字體暴露給網頁。
      */
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        radial-gradient(circle at 20% 12%, rgba(111,76,255,.14), transparent 30%),
        radial-gradient(circle at 80% 88%, rgba(255,135,169,.08), transparent 26%),
        var(--page);
      background-size:46px 46px,46px 46px,auto,auto,auto;
    }

    .viewport{
      width:var(--vwpx);
      height:var(--vhpx);
      display:grid;
      place-items:center;
      overflow:hidden;
      padding:
        max(6px, env(safe-area-inset-top))
        max(6px, env(safe-area-inset-right))
        max(6px, env(safe-area-inset-bottom))
        max(6px, env(safe-area-inset-left));
    }

    .card{
      /*
        不使用固定 650px/760px 高度。
        整張卡直接以「目前瀏覽器真正可見高度」為上限。
      */
      width:min(calc(var(--vwpx) - 12px),460px);
      height:min(calc(var(--vhpx) - 12px),900px);
      min-height:0;

      display:flex;
      flex-direction:column;
      overflow:hidden;

      border-radius:clamp(18px,3vw,30px);
      border:1px solid rgba(255,255,255,.14);
      background:#202638;
      box-shadow:0 20px 60px rgba(0,0,0,.34);
    }

    .hero{
      position:relative;
      flex:1 1 0;
      min-height:0;
      overflow:hidden;
      background:#303648;
    }

    .hero img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center 48%;
      transform:scale(1.01);
      filter:saturate(.88) brightness(.91) contrast(.96);
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(
          180deg,
          rgba(20,24,38,.02) 0%,
          rgba(20,24,38,.06) 35%,
          rgba(20,24,38,.22) 66%,
          rgba(28,32,45,.64) 100%
        ),
        linear-gradient(90deg,rgba(20,24,38,.10),transparent 58%);
      pointer-events:none;
    }

    .intro{
      position:absolute;
      z-index:2;
      left:clamp(16px,5.8vw,32px);
      right:clamp(16px,5vw,26px);
      bottom:clamp(12px,2.6vh,28px);
      text-shadow:0 2px 14px rgba(0,0,0,.62), 0 0 2px rgba(0,0,0,.22);
    }

    .name{
      margin:0 0 clamp(5px,1.15vh,11px);
      font-family:inherit;
      font-size:clamp(1.55rem,4.2vh,2.55rem);
      line-height:1.05;
      font-weight:800;
      letter-spacing:.01em;
    }

    .bio{
      margin:0;
      max-width:365px;
      font-family:inherit;
      font-size:clamp(.69rem,1.65vh,.98rem);
      line-height:1.52;
      font-weight:500;
      letter-spacing:.005em;
      color:#fff8f7;
    }

    .contact-panel{
      flex:0 0 auto;
      padding:
        clamp(8px,1.55vh,18px)
        clamp(14px,4.8vw,26px)
        clamp(9px,1.7vh,20px);

      background:
        linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)),
        var(--panel);
    }

    .quick-actions{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      align-items:stretch;
      gap:clamp(7px,2vw,10px);
      margin:0 auto clamp(8px,1.35vh,14px);
    }

    .quick{
      appearance:none;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.035);
      color:var(--pink);
      text-decoration:none;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:clamp(3px,.55vh,5px);

      min-width:0;
      min-height:clamp(48px,6.2vh,60px);
      padding:clamp(6px,.9vh,9px) 4px;

      border-radius:clamp(13px,2.6vw,18px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
      -webkit-tap-highlight-color:transparent;
      transition:transform .14s ease, background .14s ease, border-color .14s ease;
    }

    .quick:active{
      transform:scale(.96);
      background:rgba(255,255,255,.07);
      border-color:rgba(255,255,255,.13);
    }

    .quick svg{
      width:clamp(23px,3.2vh,29px);
      height:clamp(23px,3.2vh,29px);
      display:block;
      flex:0 0 auto;
      fill:currentColor;
    }

    .quick-label{
      display:block;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      color:rgba(255,255,255,.72);
      font-family:inherit;
      font-size:clamp(.55rem,1.05vh,.66rem);
      line-height:1;
      font-weight:600;
      letter-spacing:.01em;
    }

    .line-bubble{
      width:clamp(24px,3.25vh,29px);
      height:clamp(20px,2.65vh,24px);
      border-radius:45% 45% 45% 40%;
      display:grid;
      place-items:center;
      position:relative;
      flex:0 0 auto;
      background:var(--pink);
      color:#2c3142;
      font-family:inherit;
      font-size:clamp(.38rem,.82vh,.49rem);
      line-height:1;
      letter-spacing:-.04em;
      font-weight:900;
    }

    .line-bubble::after{
      content:"";
      position:absolute;
      right:3px;
      bottom:-4px;
      border-width:4px 1px 0 5px;
      border-style:solid;
      border-color:var(--pink) transparent transparent transparent;
      transform:rotate(-9deg);
    }

    .divider{
      height:0;
      margin:0;
    }

    .instagram{
      min-height:clamp(39px,5.25vh,51px);
      border-radius:clamp(14px,3vw,20px);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      color:#fff;
      font-family:inherit;
      font-size:clamp(.82rem,1.7vh,1.04rem);
      font-weight:700;
      text-decoration:none;
      background:linear-gradient(100deg,#c779e4 0%,#db84b1 48%,#e77b86 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        0 7px 18px rgba(183,89,135,.10);
      -webkit-tap-highlight-color:transparent;
      transition:transform .14s ease,filter .14s ease;
    }

    .instagram svg{
      width:clamp(19px,2.8vh,24px);
      height:clamp(19px,2.8vh,24px);
      fill:none;
      stroke:currentColor;
      stroke-width:2;
    }

    .sr-only{
      position:absolute!important;
      width:1px!important;
      height:1px!important;
      padding:0!important;
      margin:-1px!important;
      overflow:hidden!important;
      clip:rect(0,0,0,0)!important;
      white-space:nowrap!important;
      border:0!important;
    }

    /* 極矮裝置：再壓縮文字與功能區，優先保證整張卡完整出現 */
    @media (max-height:620px){
      .contact-panel{padding:6px 12px 7px}
      .quick-actions{gap:6px;margin-bottom:6px}
      .quick{min-height:40px;padding:5px 3px;border-radius:12px}
      .quick svg{width:21px;height:21px}
      .quick-label{display:none}
      .line-bubble{width:22px;height:18px;font-size:.36rem}
      .divider{display:none}
      .instagram{min-height:34px;font-size:.76rem;border-radius:12px}
      .instagram svg{width:18px;height:18px}
      .intro{bottom:8px}
      .name{font-size:1.45rem;margin-bottom:4px}
      .bio{font-size:.64rem;line-height:1.4}
    }

    @media (max-width:520px){
      .card{
        width:calc(var(--vwpx) - 12px);
        height:calc(var(--vhpx) - 12px);
        border-radius:20px;
      }
    }




    /*
      橫向 / 電腦寬螢幕：
      右側改成窄版工具列，四個聯絡方式垂直一排，
      IG 放最下方而且只保留圖示。
    */
    @media (orientation:landscape){
      .viewport{
        padding:
          max(6px, env(safe-area-inset-top))
          max(6px, env(safe-area-inset-right))
          max(6px, env(safe-area-inset-bottom))
          max(6px, env(safe-area-inset-left));
      }

      .card{
        width:calc(var(--vwpx) - 12px);
        height:calc(var(--vhpx) - 12px);
        max-width:none;
        max-height:none;

        display:grid;
        grid-template-columns:minmax(0,1fr) clamp(136px,10vw,170px);
        grid-template-rows:minmax(0,1fr);

        border-radius:clamp(16px,2vw,26px);
      }

      .hero{
        min-width:0;
        min-height:0;
        height:100%;
      }

      .hero img{
        object-position:center center;
      }

      .intro{
        left:clamp(18px,3vw,44px);
        right:clamp(18px,3vw,44px);
        bottom:clamp(14px,4vh,42px);
      }

      .name{
        font-size:clamp(1.55rem,6.5vh,3.5rem);
      }

      .bio{
        max-width:min(540px,72%);
        font-size:clamp(.68rem,2.6vh,1.1rem);
        line-height:1.48;
      }

      .contact-panel{
        height:100%;
        min-height:0;
        min-width:0;

        display:grid;
        grid-template-rows:minmax(0,1fr) auto;
        gap:clamp(7px,1.6vh,12px);

        padding:
          clamp(8px,1.6vh,14px)
          clamp(7px,.8vw,11px);

        border-left:1px solid rgba(255,255,255,.08);
      }

      .quick-actions{
        width:100%;
        height:100%;
        min-height:0;

        display:grid;
        grid-template-columns:minmax(0,1fr);
        grid-template-rows:repeat(4,minmax(0,1fr));

        gap:clamp(6px,1.1vh,10px);
        margin:0;
      }

      .quick{
        width:100%;
        height:100%;
        min-height:0;

        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:clamp(3px,.8vh,6px);

        padding:4px 2px;
        border-radius:clamp(12px,1.2vw,16px);
      }

      .quick svg{
        width:clamp(22px,4.2vh,31px);
        height:clamp(22px,4.2vh,31px);
      }

      .quick-label{
        font-size:clamp(.50rem,1.45vh,.68rem);
      }

      .line-bubble{
        width:clamp(24px,4.4vh,31px);
        height:clamp(19px,3.6vh,25px);
      }

      .instagram{
        width:100%;
        min-height:clamp(42px,7.8vh,56px);
        border-radius:clamp(12px,1.2vw,16px);
        gap:clamp(6px,.8vw,10px);
        padding:0 clamp(8px,1vw,14px);
        white-space:nowrap;
      }

      .instagram span{
        display:inline;
        font-size:clamp(.66rem,1.55vh,.86rem);
      }

      .instagram svg{
        width:clamp(22px,4.2vh,30px);
        height:clamp(22px,4.2vh,30px);
      }
    }

    /* 超寬桌面也維持窄工具列，不再把右側放大 */
    @media (orientation:landscape) and (min-width:1200px){
      .card{
        grid-template-columns:minmax(0,1fr) clamp(144px,9vw,178px);
      }

      .contact-panel{
        padding:
          clamp(10px,1.8vh,16px)
          clamp(8px,.75vw,12px);
      }
    }

    /* 很矮的橫向手機：再縮一點，仍維持單欄 */
    @media (orientation:landscape) and (max-height:520px){
      .card{
        grid-template-columns:minmax(0,1fr) clamp(104px,17vw,126px);
      }

      .contact-panel{
        padding:5px 5px;
        gap:5px;
      }

      .quick-actions{
        gap:4px;
      }

      .quick{
        padding:2px;
        border-radius:10px;
      }

      .quick-label{
        display:none;
      }

      .quick svg{
        width:19px;
        height:19px;
      }

      .line-bubble{
        width:21px;
        height:17px;
        font-size:.34rem;
      }

      .instagram{
        min-height:31px;
        border-radius:10px;
        gap:4px;
        padding:0 5px;
      }

      .instagram span{
        display:none;
      }

      .instagram svg{
        width:17px;
        height:17px;
      }

      .intro{
        bottom:8px;
      }

      .name{
        font-size:clamp(1.25rem,6vh,1.8rem);
        margin-bottom:3px;
      }

      .bio{
        font-size:clamp(.56rem,2.2vh,.72rem);
        line-height:1.35;
      }
    }



    @keyframes photoChange{
      from{opacity:.35;transform:scale(1.035)}
      to{opacity:1;transform:scale(1.01)}
    }

    .hero img.photo-change{
      animation:photoChange .45s ease-out both;
    }



    /* 旋轉時：舊圖留著，新圖載入完成後才做較長的交叉淡入淡出 */
    .hero{
      isolation:isolate;
    }

    .hero-photo{
      opacity:0;
      z-index:0;
      transition:
        opacity 1.45s cubic-bezier(.22,.70,.20,1),
        transform 1.55s cubic-bezier(.22,.70,.20,1),
        filter 1.45s ease;
      will-change:opacity,transform,filter;
    }

    .hero-photo.is-active{
      opacity:1;
      z-index:1;
    }

    .hero-photo.is-waiting{
      opacity:0;
      transform:scale(1.035);
      filter:saturate(.82) brightness(.84) contrast(.94) blur(1.5px);
    }

    .hero::after{
      z-index:2;
    }

    .intro{
      z-index:4;
    }

    @keyframes orientationContentIn{
      from{
        opacity:.15;
        transform:translateY(12px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes orientationPanelIn{
      from{
        opacity:.30;
        transform:translateX(8px);
      }
      to{
        opacity:1;
        transform:translateX(0);
      }
    }

    body.opening-finished .card,
    body.opening-finished .hero img,
    body.opening-finished .intro,
    body.opening-finished .quick,
    body.opening-finished .instagram{
      animation:none;
    }

    body.opening-finished .intro,
    body.opening-finished .quick,
    body.opening-finished .instagram{
      opacity:1;
      transform:none;
    }

    body.opening-finished .card.orientation-loading .hero-photo.is-active{
      opacity:.82;
      transform:scale(1.015);
      filter:saturate(.84) brightness(.86) contrast(.95);
    }

    body.opening-finished .card.orientation-transition .intro{
      animation:orientationContentIn .95s cubic-bezier(.22,.72,.2,1) .18s both !important;
    }

    body.opening-finished .card.orientation-transition .contact-panel{
      animation:orientationPanelIn 1.00s cubic-bezier(.22,.72,.2,1) .12s both !important;
      transform-origin:center;
    }

    /* 開場動畫 */
    @keyframes cardEnter{
      from{
        opacity:0;
        transform:translateY(18px) scale(.975);
        filter:blur(5px);
      }
      to{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
      }
    }

    @keyframes heroReveal{
      from{
        opacity:.25;
        transform:scale(1.075);
      }
      to{
        opacity:1;
        transform:scale(1.01);
      }
    }

    @keyframes contentRise{
      from{
        opacity:0;
        transform:translateY(14px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes actionPop{
      from{
        opacity:0;
        transform:translateY(10px) scale(.90);
      }
      70%{
        transform:translateY(-1px) scale(1.015);
      }
      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    .card{
      animation:cardEnter .72s cubic-bezier(.22,.78,.24,1) both;
      transform-origin:center center;
    }

    .hero img{
      animation:heroReveal 1.05s cubic-bezier(.22,.72,.2,1) both;
    }

    .intro{
      opacity:0;
      animation:contentRise .62s cubic-bezier(.22,.72,.2,1) .24s both;
    }

    .quick{
      opacity:0;
      animation:actionPop .48s cubic-bezier(.22,.72,.2,1) both;
    }

    .quick:nth-child(1){animation-delay:.42s}
    .quick:nth-child(2){animation-delay:.50s}
    .quick:nth-child(3){animation-delay:.58s}
    .quick:nth-child(4){animation-delay:.66s}

    .instagram{
      opacity:0;
      animation:contentRise .55s cubic-bezier(.22,.72,.2,1) .74s both;
    }

    @media (prefers-reduced-motion:reduce){
      .card,
      .hero img,
      .intro,
      .quick,
      .instagram{
        animation:none!important;
        transition:none!important;
        opacity:1!important;
        transform:none!important;
        filter:none!important;
      }
    }

  </style>
</head>

<body>
  <div class="viewport">
  <main class="card">
    <section class="hero">
      <img id="hero-photo-a" class="hero-photo is-active" alt="">
      <img id="hero-photo-b" class="hero-photo" alt="">
      <div class="intro">
        <h1 class="name">__CARD_NAME__</h1>
        <p class="bio">
          喜歡雨天的氛圍、好聽的音樂，<br>
          以及平凡生活裡的小確幸<br>
          訊息慢回，生活優先 🎧
        </p>
      </div>
    </section>

    <section class="contact-panel" aria-label="聯絡方式">
      <div class="quick-actions">
        <a class="quick" href="mailto:__CARD_EMAIL__" aria-label="寄 Email">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 5.5A2.5 2.5 0 0 1 5 3h14a2.5 2.5 0 0 1 2.5 2.5v13A2.5 2.5 0 0 1 19 21H5a2.5 2.5 0 0 1-2.5-2.5v-13Zm2.7-.5L12 10.05 18.8 5H5.2Zm14.3 2.05-6.6 4.9a1.5 1.5 0 0 1-1.8 0L4.5 7.05V18.5c0 .28.22.5.5.5h14a.5.5 0 0 0 .5-.5V7.05Z"/>
          </svg>
          <span class="quick-label">Email</span><span class="sr-only">Email</span>
        </a>

        <a class="quick" href="__CARD_DISCORD_URL__" target="_blank" rel="noopener" aria-label="Discord">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.54 5.34A16.4 16.4 0 0 0 15.44 4l-.5 1.03a15 15 0 0 0-5.86 0L8.56 4a16.4 16.4 0 0 0-4.1 1.34C1.87 9.18 1.17 12.93 1.52 16.63a16.73 16.73 0 0 0 5.03 2.54l1.22-1.68a10.6 10.6 0 0 1-1.92-.92l.47-.37c3.7 1.7 7.73 1.7 11.38 0l.47.37c-.62.36-1.27.67-1.93.92l1.22 1.68a16.63 16.63 0 0 0 5.02-2.54c.42-4.29-.72-8-2.94-11.29ZM8.42 14.38c-1.11 0-2.02-1.03-2.02-2.29s.89-2.3 2.02-2.3 2.04 1.04 2.02 2.3c0 1.26-.9 2.29-2.02 2.29Zm7.16 0c-1.11 0-2.02-1.03-2.02-2.29s.89-2.3 2.02-2.3 2.04 1.04 2.02 2.3c0 1.26-.89 2.29-2.02 2.29Z"/>
          </svg>
          <span class="quick-label">Discord</span><span class="sr-only">Discord</span>
        </a>

        <a class="quick" href="__CARD_LINE_URL__" target="_blank" rel="noopener" aria-label="LINE">
          <span class="line-bubble" aria-hidden="true">LINE</span>
          <span class="quick-label">LINE</span><span class="sr-only">LINE</span>
        </a>

        <a class="quick" href="tel:__CARD_PHONE__" aria-label="撥打電話">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.62 10.79a15.47 15.47 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.58a1 1 0 0 1-.25 1.02l-2.2 2.19Z"/>
          </svg>
          <span class="quick-label">Phone</span><span class="sr-only">電話</span>
        </a>
      </div>

      <div class="divider"></div>

      <a class="instagram" href="__CARD_IG_URL__" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4.2"></circle>
          <circle cx="17.4" cy="6.7" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
        <span>Instagram</span>
      </a>
    </section>
  </main>
  </div>

  <script>
    (() => {
      const root = document.documentElement;
      const card = document.querySelector(".card");

      const layers = [
        document.getElementById("hero-photo-a"),
        document.getElementById("hero-photo-b")
      ];

      const manifest = __IMAGE_MANIFEST_JSON__;
      const buildId = __IMAGE_BUILD_ID_JSON__;

      const portraitImages = Array.isArray(manifest.portrait) ? manifest.portrait : [];
      const landscapeImages = Array.isArray(manifest.landscape) ? manifest.landscape : [];

      const memoryIndex = {portrait:0, landscape:0};

      let activeLayer = 0;
      let lastMode = null;
      let orientationTimer = 0;
      let transitionTimer = 0;
      let loadGeneration = 0;

      const viewportSize = () => {
        const vv = window.visualViewport;
        return {
          width: Math.round(vv ? vv.width : window.innerWidth),
          height: Math.round(vv ? vv.height : window.innerHeight)
        };
      };

      const updateViewport = () => {
        const {width, height} = viewportSize();
        root.style.setProperty("--vwpx", width + "px");
        root.style.setProperty("--vhpx", height + "px");
      };

      const currentMode = () => {
        if (window.matchMedia) {
          return window.matchMedia("(orientation: portrait)").matches
            ? "portrait"
            : "landscape";
        }

        const {width, height} = viewportSize();
        return height >= width ? "portrait" : "landscape";
      };

      const versionedUrl = (path) => {
        if (!path) return "";
        const separator = path.includes("?") ? "&" : "?";
        return path + separator + "v=" + encodeURIComponent(buildId);
      };

      /*
        依檔名順序播放，不隨機。
        每組各自循環：01 → 02 → 03 → 01……
      */
      const nextSequential = (items, mode) => {
        if (!Array.isArray(items) || items.length === 0) return "";

        const key = "card-sequence-" + buildId + "-" + mode;
        let index = memoryIndex[mode] || 0;

        try {
          const saved = Number.parseInt(localStorage.getItem(key) || "0", 10);
          if (Number.isFinite(saved) && saved >= 0) index = saved;
        } catch (_) {}

        const normalized = index % items.length;
        const picked = items[normalized];
        const nextIndex = (normalized + 1) % items.length;

        memoryIndex[mode] = nextIndex;
        try { localStorage.setItem(key, String(nextIndex)); } catch (_) {}

        return picked;
      };

      const peekSequential = (items, mode) => {
        if (!Array.isArray(items) || items.length === 0) return "";

        const key = "card-sequence-" + buildId + "-" + mode;
        let index = memoryIndex[mode] || 0;

        try {
          const saved = Number.parseInt(localStorage.getItem(key) || "0", 10);
          if (Number.isFinite(saved) && saved >= 0) index = saved;
        } catch (_) {}

        return items[index % items.length] || "";
      };

      const poolFor = (mode) => {
        let pool = mode === "portrait" ? portraitImages : landscapeImages;

        if (!pool.length) {
          pool = mode === "portrait" ? landscapeImages : portraitImages;
        }

        return pool;
      };

      const preload = (path) => {
        if (!path) return;

        const img = new Image();
        img.decoding = "async";
        img.src = versionedUrl(path);

        if (typeof img.decode === "function") {
          img.decode().catch(() => {});
        }
      };

      const loadImage = async (url) => {
        const probe = new Image();
        probe.decoding = "async";
        probe.src = url;

        try {
          if (typeof probe.decode === "function") {
            await probe.decode();
          } else {
            await new Promise((resolve, reject) => {
              probe.onload = resolve;
              probe.onerror = reject;
            });
          }
          return true;
        } catch (_) {
          return false;
        }
      };

      const startPanelAnimation = () => {
        if (!card || !document.body.classList.contains("opening-finished")) return;

        card.classList.remove("orientation-transition");
        void card.offsetWidth;
        card.classList.add("orientation-transition");

        clearTimeout(transitionTimer);
        transitionTimer = window.setTimeout(() => {
          card.classList.remove("orientation-transition");
        }, 1500);
      };

      const crossfadeTo = async (path, animate = false) => {
        if (!path) return;

        const generation = ++loadGeneration;
        const url = versionedUrl(path);

        if (animate && card) {
          card.classList.add("orientation-loading");
        }

        // 舊圖不會先消失；先在背景把新圖載完。
        const loaded = await loadImage(url);

        // 如果使用者又旋轉了一次，舊的載入結果直接丟掉。
        if (generation !== loadGeneration) return;

        if (card) {
          card.classList.remove("orientation-loading");
        }

        if (!loaded) return;

        const oldIndex = activeLayer;
        const newIndex = oldIndex === 0 ? 1 : 0;

        const oldLayer = layers[oldIndex];
        const newLayer = layers[newIndex];

        if (!oldLayer || !newLayer) return;

        newLayer.classList.remove("is-active");
        newLayer.classList.add("is-waiting");
        newLayer.src = url;

        // 讓瀏覽器先套用等待狀態，再開始 1.45 秒交叉淡化。
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        if (generation !== loadGeneration) return;

        newLayer.classList.remove("is-waiting");
        newLayer.classList.add("is-active");
        oldLayer.classList.remove("is-active");

        activeLayer = newIndex;

        if (animate) {
          startPanelAnimation();
        }

        // 等淡出完成後再清掉舊層，避免旋轉過程出現空白。
        window.setTimeout(() => {
          if (activeLayer !== oldIndex && !oldLayer.classList.contains("is-active")) {
            oldLayer.removeAttribute("src");
          }
        }, 1650);
      };

      const showNextForMode = async (mode, animate = false) => {
        const pool = poolFor(mode);
        const next = nextSequential(pool, mode);

        if (!next) return;

        await crossfadeTo(next, animate);

        // 預載下一張同方向，以及另一方向的下一張。
        preload(peekSequential(pool, mode));

        const otherMode = mode === "portrait" ? "landscape" : "portrait";
        preload(peekSequential(poolFor(otherMode), otherMode));
      };

      const applyOrientationIfChanged = () => {
        updateViewport();

        const mode = currentMode();
        if (mode === lastMode) return;

        lastMode = mode;
        showNextForMode(mode, true);
      };

      const scheduleOrientationCheck = () => {
        updateViewport();

        clearTimeout(orientationTimer);
        orientationTimer = window.setTimeout(() => {
          applyOrientationIfChanged();
        }, 140);
      };

      // 初次開啟。
      updateViewport();
      lastMode = currentMode();
      showNextForMode(lastMode, false);

      window.setTimeout(() => {
        document.body.classList.add("opening-finished");
      }, 1200);

      /*
        不同手機/瀏覽器旋轉時會觸發不同事件。
        多路監聽，但只有方向真的改變才換一次照片。
      */
      window.addEventListener("orientationchange", scheduleOrientationCheck, {passive:true});
      window.addEventListener("resize", scheduleOrientationCheck, {passive:true});

      const portraitQuery = window.matchMedia
        ? window.matchMedia("(orientation: portrait)")
        : null;

      if (portraitQuery) {
        if (portraitQuery.addEventListener) {
          portraitQuery.addEventListener("change", scheduleOrientationCheck);
        } else if (portraitQuery.addListener) {
          portraitQuery.addListener(scheduleOrientationCheck);
        }
      }

      if (window.screen &&
          window.screen.orientation &&
          window.screen.orientation.addEventListener) {
        window.screen.orientation.addEventListener("change", scheduleOrientationCheck);
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", scheduleOrientationCheck, {passive:true});
        window.visualViewport.addEventListener("scroll", updateViewport, {passive:true});
      }

      window.addEventListener("pageshow", (event) => {
        updateViewport();
        if (event.persisted) scheduleOrientationCheck();
      });
    })();
  </script>
</body>
</html>
