<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#151a2d">
  <title>__CARD_NAME__｜個人名片</title>


  <style>
    :root{
      color-scheme: dark;
      --page:#121728;
      --panel:#282e3f;
      --text:#fff7f6;
      --pink:#ffb3c1;

      /* JS 會用 visualViewport 的真正可視範圍更新這兩個值 */
      --vwpx:100vw;
      --vhpx:100vh;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--page);
    }

    html{
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }

    body{
      color:var(--text);

      /*
        網頁能要求「系統 UI 字體」，但 Chrome/Safari 不一定會把
        手機主題商店或 OEM 自訂字體暴露給網頁。
      */
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        radial-gradient(circle at 20% 12%, rgba(111,76,255,.14), transparent 30%),
        radial-gradient(circle at 80% 88%, rgba(255,135,169,.08), transparent 26%),
        var(--page);
      background-size:46px 46px,46px 46px,auto,auto,auto;
    }

    .viewport{
      width:var(--vwpx);
      height:var(--vhpx);
      display:grid;
      place-items:center;
      overflow:hidden;
      padding:
        max(6px, env(safe-area-inset-top))
        max(6px, env(safe-area-inset-right))
        max(6px, env(safe-area-inset-bottom))
        max(6px, env(safe-area-inset-left));
    }

    .card{
      /*
        不使用固定 650px/760px 高度。
        整張卡直接以「目前瀏覽器真正可見高度」為上限。
      */
      width:min(calc(var(--vwpx) - 12px),460px);
      height:min(calc(var(--vhpx) - 12px),900px);
      min-height:0;

      display:flex;
      flex-direction:column;
      overflow:hidden;

      border-radius:clamp(18px,3vw,30px);
      border:1px solid rgba(255,255,255,.14);
      background:#202638;
      box-shadow:0 20px 60px rgba(0,0,0,.34);
    }

    .hero{
      position:relative;
      flex:1 1 0;
      min-height:0;
      overflow:hidden;
      background:#303648;
    }

    .hero img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center 48%;
      transform:scale(1.01);
      filter:saturate(.88) brightness(.91) contrast(.96);
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(
          180deg,
          rgba(20,24,38,.02) 0%,
          rgba(20,24,38,.06) 35%,
          rgba(20,24,38,.30) 66%,
          rgba(28,32,45,.80) 100%
        ),
        linear-gradient(90deg,rgba(20,24,38,.10),transparent 58%);
      pointer-events:none;
    }

    .intro{
      position:absolute;
      z-index:2;
      left:clamp(16px,5.8vw,32px);
      right:clamp(16px,5vw,26px);
      bottom:clamp(12px,2.6vh,28px);
      text-shadow:0 2px 14px rgba(0,0,0,.42);
    }

    .name{
      margin:0 0 clamp(5px,1.15vh,11px);
      font-family:inherit;
      font-size:clamp(1.55rem,4.2vh,2.55rem);
      line-height:1.05;
      font-weight:800;
      letter-spacing:.01em;
    }

    .bio{
      margin:0;
      max-width:365px;
      font-family:inherit;
      font-size:clamp(.69rem,1.65vh,.98rem);
      line-height:1.52;
      font-weight:500;
      letter-spacing:.005em;
      color:#fff8f7;
    }

    .contact-panel{
      flex:0 0 auto;
      padding:
        clamp(8px,1.55vh,18px)
        clamp(14px,4.8vw,26px)
        clamp(9px,1.7vh,20px);

      background:
        linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)),
        var(--panel);
    }

    .quick-actions{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      align-items:center;
      gap:6px;
      margin:0 auto clamp(6px,1.25vh,14px);
    }

    .quick{
      appearance:none;
      border:0;
      background:transparent;
      color:var(--pink);
      text-decoration:none;
      display:grid;
      place-items:center;
      min-height:clamp(34px,4.9vh,50px);
      border-radius:14px;
      -webkit-tap-highlight-color:transparent;
    }

    .quick svg{
      width:clamp(24px,3.4vh,32px);
      height:clamp(24px,3.4vh,32px);
      display:block;
      fill:currentColor;
    }

    .line-bubble{
      width:clamp(27px,3.6vh,32px);
      height:clamp(21px,2.9vh,26px);
      border-radius:50%;
      display:grid;
      place-items:center;
      position:relative;
      background:var(--pink);
      color:#2c3142;
      font-family:inherit;
      font-size:clamp(.42rem,.9vh,.55rem);
      line-height:1;
      letter-spacing:-.03em;
      font-weight:900;
    }

    .line-bubble::after{
      content:"";
      position:absolute;
      right:4px;
      bottom:-4px;
      border-width:5px 2px 0 6px;
      border-style:solid;
      border-color:var(--pink) transparent transparent transparent;
      transform:rotate(-10deg);
    }

    .divider{
      height:1px;
      margin:0 2px clamp(6px,1.2vh,13px);
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.22) 12%,rgba(255,255,255,.22) 88%,transparent);
    }

    .instagram{
      min-height:clamp(38px,5.1vh,50px);
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      color:#fff;
      font-family:inherit;
      font-size:clamp(.82rem,1.7vh,1.05rem);
      font-weight:700;
      text-decoration:none;
      background:linear-gradient(100deg,#c779e4 0%,#db84b1 48%,#e77b86 100%);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
      -webkit-tap-highlight-color:transparent;
    }

    .instagram svg{
      width:clamp(19px,2.8vh,24px);
      height:clamp(19px,2.8vh,24px);
      fill:none;
      stroke:currentColor;
      stroke-width:2;
    }

    .sr-only{
      position:absolute!important;
      width:1px!important;
      height:1px!important;
      padding:0!important;
      margin:-1px!important;
      overflow:hidden!important;
      clip:rect(0,0,0,0)!important;
      white-space:nowrap!important;
      border:0!important;
    }

    /* 極矮裝置：再壓縮文字與功能區，優先保證整張卡完整出現 */
    @media (max-height:620px){
      .contact-panel{padding:6px 14px 7px}
      .quick-actions{margin-bottom:4px}
      .quick{min-height:30px}
      .quick svg{width:22px;height:22px}
      .divider{margin-bottom:4px}
      .instagram{min-height:34px;font-size:.76rem}
      .instagram svg{width:18px;height:18px}
      .intro{bottom:8px}
      .name{font-size:1.45rem;margin-bottom:4px}
      .bio{font-size:.64rem;line-height:1.4}
    }

    @media (max-width:520px){
      .card{
        width:calc(var(--vwpx) - 12px);
        height:calc(var(--vhpx) - 12px);
        border-radius:20px;
      }
    }

    @media (prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important}
    }
  </style>
</head>

<body>
  <div class="viewport">
  <main class="card">
    <section class="hero">
      <img src="asset-01.jpg" alt="">
      <div class="intro">
        <h1 class="name">__CARD_NAME__</h1>
        <p class="bio">
          喜歡雨天的氛圍、好聽的音樂，<br>
          以及平凡生活裡的小確幸<br>
          訊息慢回，生活優先 🎧
        </p>
      </div>
    </section>

    <section class="contact-panel" aria-label="聯絡方式">
      <div class="quick-actions">
        <a class="quick" href="mailto:__CARD_EMAIL__" aria-label="寄 Email">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 5.5A2.5 2.5 0 0 1 5 3h14a2.5 2.5 0 0 1 2.5 2.5v13A2.5 2.5 0 0 1 19 21H5a2.5 2.5 0 0 1-2.5-2.5v-13Zm2.7-.5L12 10.05 18.8 5H5.2Zm14.3 2.05-6.6 4.9a1.5 1.5 0 0 1-1.8 0L4.5 7.05V18.5c0 .28.22.5.5.5h14a.5.5 0 0 0 .5-.5V7.05Z"/>
          </svg>
          <span class="sr-only">Email</span>
        </a>

        <a class="quick" href="__CARD_DISCORD_URL__" target="_blank" rel="noopener" aria-label="Discord">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.54 5.34A16.4 16.4 0 0 0 15.44 4l-.5 1.03a15 15 0 0 0-5.86 0L8.56 4a16.4 16.4 0 0 0-4.1 1.34C1.87 9.18 1.17 12.93 1.52 16.63a16.73 16.73 0 0 0 5.03 2.54l1.22-1.68a10.6 10.6 0 0 1-1.92-.92l.47-.37c3.7 1.7 7.73 1.7 11.38 0l.47.37c-.62.36-1.27.67-1.93.92l1.22 1.68a16.63 16.63 0 0 0 5.02-2.54c.42-4.29-.72-8-2.94-11.29ZM8.42 14.38c-1.11 0-2.02-1.03-2.02-2.29s.89-2.3 2.02-2.3 2.04 1.04 2.02 2.3c0 1.26-.9 2.29-2.02 2.29Zm7.16 0c-1.11 0-2.02-1.03-2.02-2.29s.89-2.3 2.02-2.3 2.04 1.04 2.02 2.3c0 1.26-.89 2.29-2.02 2.29Z"/>
          </svg>
          <span class="sr-only">Discord</span>
        </a>

        <a class="quick" href="__CARD_LINE_URL__" target="_blank" rel="noopener" aria-label="LINE">
          <span class="line-bubble" aria-hidden="true">LINE</span>
          <span class="sr-only">LINE</span>
        </a>

        <a class="quick" href="tel:__CARD_PHONE__" aria-label="撥打電話">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.62 10.79a15.47 15.47 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.58a1 1 0 0 1-.25 1.02l-2.2 2.19Z"/>
          </svg>
          <span class="sr-only">電話</span>
        </a>
      </div>

      <div class="divider"></div>

      <a class="instagram" href="__CARD_IG_URL__" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4.2"></circle>
          <circle cx="17.4" cy="6.7" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
        <span>Instagram</span>
      </a>
    </section>
  </main>
  </div>

  <script>
    (() => {
      const root = document.documentElement;
      const updateViewport = () => {
        const vv = window.visualViewport;
        const w = Math.round(vv ? vv.width : window.innerWidth);
        const h = Math.round(vv ? vv.height : window.innerHeight);
        root.style.setProperty("--vwpx", w + "px");
        root.style.setProperty("--vhpx", h + "px");
      };
      updateViewport();
      window.addEventListener("resize", updateViewport, {passive:true});
      window.addEventListener("orientationchange", updateViewport, {passive:true});
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", updateViewport, {passive:true});
        window.visualViewport.addEventListener("scroll", updateViewport, {passive:true});
      }
    })();
  </script>
</body>
</html>
