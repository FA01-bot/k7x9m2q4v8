<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#151a2d">
  <title>__CARD_NAME__｜個人名片</title>

  <style>
    :root{
      color-scheme: dark;
      --page:#121728;
      --panel:#282e3f;
      --text:#fff7f6;
      --muted:#e7dfe2;
      --pink:#ffb3c1;
      --line:rgba(255,255,255,.16);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
    }

    body{
      height:100dvh;
      overflow:hidden;
      display:grid;
      place-items:center;
      padding:max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      color:var(--text);

      /* 跟著裝置/系統使用者設定的預設字體 */
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:100%;

      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        radial-gradient(circle at 20% 12%, rgba(111,76,255,.14), transparent 30%),
        radial-gradient(circle at 80% 88%, rgba(255,135,169,.08), transparent 26%),
        var(--page);
      background-size:46px 46px,46px 46px,auto,auto,auto;
    }

    .card{
      width:min(94vw,460px);
      height:min(calc(100dvh - 16px),900px);
      min-height:0;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      border-radius:clamp(20px,3.2vw,30px);
      border:1px solid rgba(255,255,255,.14);
      background:#202638;
      box-shadow:0 24px 70px rgba(0,0,0,.36);
    }

    .hero{
      position:relative;
      flex:1 1 auto;
      min-height:0;
      background:#303648;
      overflow:hidden;
    }

    .hero img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center 48%;
      transform:scale(1.01);
      filter:saturate(.88) brightness(.91) contrast(.96);
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(
          180deg,
          rgba(20,24,38,.03) 0%,
          rgba(20,24,38,.06) 38%,
          rgba(20,24,38,.28) 66%,
          rgba(28,32,45,.76) 100%
        ),
        linear-gradient(90deg, rgba(20,24,38,.10), transparent 55%);
      pointer-events:none;
    }

    .intro{
      position:absolute;
      z-index:2;
      left:clamp(18px,6vw,34px);
      right:clamp(18px,5vw,28px);
      bottom:clamp(16px,3dvh,34px);
      text-shadow:0 2px 16px rgba(0,0,0,.42);
    }

    .name{
      margin:0 0 clamp(7px,1.4dvh,14px);
      font:inherit;
      font-size:clamp(1.85rem,4.6dvh,2.75rem);
      line-height:1.05;
      font-weight:800;
      letter-spacing:.015em;
    }

    .bio{
      margin:0;
      max-width:365px;
      font:inherit;
      font-size:clamp(.78rem,1.9dvh,1.05rem);
      line-height:1.62;
      letter-spacing:.01em;
      font-weight:500;
      color:#fff8f7;
    }

    .contact-panel{
      flex:0 0 auto;
      padding:
        clamp(12px,2.1dvh,24px)
        clamp(16px,5vw,28px)
        clamp(14px,2.5dvh,28px);
      background:
        linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,0)),
        var(--panel);
    }

    .quick-actions{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      align-items:center;
      gap:clamp(6px,1.8vw,10px);
      margin:0 auto clamp(10px,2dvh,22px);
    }

    .quick{
      appearance:none;
      border:0;
      background:transparent;
      color:var(--pink);
      text-decoration:none;
      display:grid;
      place-items:center;
      min-height:clamp(40px,5.8dvh,58px);
      border-radius:16px;
      transition:transform .14s ease, background .14s ease;
      -webkit-tap-highlight-color:transparent;
    }

    .quick:active{
      transform:scale(.94);
      background:rgba(255,255,255,.05);
    }

    .quick svg{
      width:clamp(27px,4dvh,36px);
      height:clamp(27px,4dvh,36px);
      display:block;
      fill:currentColor;
    }

    .line-bubble{
      width:clamp(30px,4.1dvh,36px);
      height:clamp(24px,3.3dvh,29px);
      border-radius:50%;
      display:grid;
      place-items:center;
      position:relative;
      background:var(--pink);
      color:#2c3142;
      font-size:clamp(.48rem,1.1dvh,.64rem);
      line-height:1;
      letter-spacing:-.03em;
      font-weight:900;
    }

    .line-bubble::after{
      content:"";
      position:absolute;
      right:4px;
      bottom:-5px;
      border-width:6px 2px 0 7px;
      border-style:solid;
      border-color:var(--pink) transparent transparent transparent;
      transform:rotate(-10deg);
    }

    .divider{
      height:1px;
      margin:0 2px clamp(10px,2dvh,20px);
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.22) 12%, rgba(255,255,255,.22) 88%, transparent);
    }

    .instagram{
      min-height:clamp(44px,6dvh,58px);
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(8px,2vw,12px);
      color:#fff;
      font:inherit;
      font-size:clamp(.92rem,2dvh,1.15rem);
      font-weight:700;
      text-decoration:none;
      background:linear-gradient(100deg,#c779e4 0%,#db84b1 48%,#e77b86 100%);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.12), 0 12px 26px rgba(183,89,135,.13);
      transition:transform .14s ease, filter .14s ease;
      -webkit-tap-highlight-color:transparent;
    }

    .instagram:active{
      transform:scale(.985);
      filter:brightness(.96);
    }

    .instagram svg{
      width:clamp(22px,3.3dvh,27px);
      height:clamp(22px,3.3dvh,27px);
      fill:none;
      stroke:currentColor;
      stroke-width:2;
    }

    .sr-only{
      position:absolute!important;
      width:1px!important;
      height:1px!important;
      padding:0!important;
      margin:-1px!important;
      overflow:hidden!important;
      clip:rect(0,0,0,0)!important;
      white-space:nowrap!important;
      border:0!important;
    }

    @media (max-height:680px){
      .card{width:min(92vw,420px)}
      .intro{bottom:12px}
      .name{font-size:clamp(1.55rem,4.6dvh,2.1rem);margin-bottom:5px}
      .bio{font-size:clamp(.68rem,1.8dvh,.9rem);line-height:1.45}
      .contact-panel{padding:9px 18px 11px}
      .quick-actions{margin-bottom:7px}
      .quick{min-height:36px}
      .divider{margin-bottom:8px}
      .instagram{min-height:40px}
    }

    @media (max-width:520px){
      .card{
        width:100%;
        height:calc(100dvh - 16px);
        border-radius:22px;
      }
    }

    @media (prefers-reduced-motion:reduce){
      .quick,.instagram{transition:none}
    }
  </style>
</head>

<body>
  <main class="card">
    <section class="hero">
      <img src="asset-01.jpg" alt="">
      <div class="intro">
        <h1 class="name">__CARD_NAME__</h1>
        <p class="bio">
          喜歡雨天的氛圍、好聽的音樂，<br>
          以及平凡生活裡的小確幸<br>
          訊息慢回，生活優先 🎧
        </p>
      </div>
    </section>

    <section class="contact-panel" aria-label="聯絡方式">
      <div class="quick-actions">
        <a class="quick" href="mailto:__CARD_EMAIL__" aria-label="寄 Email">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 5.5A2.5 2.5 0 0 1 5 3h14a2.5 2.5 0 0 1 2.5 2.5v13A2.5 2.5 0 0 1 19 21H5a2.5 2.5 0 0 1-2.5-2.5v-13Zm2.7-.5L12 10.05 18.8 5H5.2Zm14.3 2.05-6.6 4.9a1.5 1.5 0 0 1-1.8 0L4.5 7.05V18.5c0 .28.22.5.5.5h14a.5.5 0 0 0 .5-.5V7.05Z"/>
          </svg>
          <span class="sr-only">Email</span>
        </a>

        <a class="quick" href="__CARD_DISCORD_URL__" target="_blank" rel="noopener" aria-label="Discord">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.54 5.34A16.4 16.4 0 0 0 15.44 4l-.5 1.03a15 15 0 0 0-5.86 0L8.56 4a16.4 16.4 0 0 0-4.1 1.34C1.87 9.18 1.17 12.93 1.52 16.63a16.73 16.73 0 0 0 5.03 2.54l1.22-1.68a10.6 10.6 0 0 1-1.92-.92l.47-.37c3.7 1.7 7.73 1.7 11.38 0l.47.37c-.62.36-1.27.67-1.93.92l1.22 1.68a16.63 16.63 0 0 0 5.02-2.54c.42-4.29-.72-8-2.94-11.29ZM8.42 14.38c-1.11 0-2.02-1.03-2.02-2.29s.89-2.3 2.02-2.3 2.04 1.04 2.02 2.3c0 1.26-.9 2.29-2.02 2.29Zm7.16 0c-1.11 0-2.02-1.03-2.02-2.29s.89-2.3 2.02-2.3 2.04 1.04 2.02 2.3c0 1.26-.89 2.29-2.02 2.29Z"/>
          </svg>
          <span class="sr-only">Discord</span>
        </a>

        <a class="quick" href="__CARD_LINE_URL__" target="_blank" rel="noopener" aria-label="LINE">
          <span class="line-bubble" aria-hidden="true">LINE</span>
          <span class="sr-only">LINE</span>
        </a>

        <a class="quick" href="tel:__CARD_PHONE__" aria-label="撥打電話">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.62 10.79a15.47 15.47 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.58a1 1 0 0 1-.25 1.02l-2.2 2.19Z"/>
          </svg>
          <span class="sr-only">電話</span>
        </a>
      </div>

      <div class="divider"></div>

      <a class="instagram" href="__CARD_IG_URL__" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4.2"></circle>
          <circle cx="17.4" cy="6.7" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
        <span>Instagram</span>
      </a>
    </section>
  </main>
</body>
</html>
